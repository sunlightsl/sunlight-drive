/* ================================================================
   上传
   ================================================================ */
/* 目录是「用到才建」，不是先把整棵树建出来。
   每层建过的记在 dirCache，同一层只建一次。
   为什么不提前把整棵树建好：传不上去的时候（服务器没配对象存储、登录掉了、
   网断了）会留下一整片空文件夹 —— 用户得自己一个个删，很烦。 */
const dirCache = new Map();
async function ensureDir(base, relDir) {
  const key = (base || '') + '\u0000' + relDir;
  if (dirCache.has(key)) return dirCache.get(key);
  const cut = relDir.lastIndexOf('/');
  const parentRel = cut < 0 ? '' : relDir.slice(0, cut);
  const name = cut < 0 ? relDir : relDir.slice(cut + 1);
  // 按层级自上而下：先把父层建出来，再建自己
  const parentId = parentRel ? await ensureDir(base, parentRel) : (base || null);
  const r = await api('/api/folder', {
    method: 'POST', body: JSON.stringify({ name, parent: parentId })
  });
  const id = (r.node && r.node.id) || parentId;
  dirCache.set(key, id);
  return id;
}

/* 把一批文件编排进上传队列。
   items = [{ file, rel }]，rel 是相对路径（"a.txt" 或 "top/sub/a.png"）。
   目录不在这里建，留给 uploadOne 真要用的时候再建（见上面 ensureDir）。 */
function enqueueUploads(items, baseParent) {
  const base = baseParent || null;
  const maxB = (S.meta.maxUploadMB || 2048) * 1048576;
  /* 登录后 /api/account 给的是"这个人"的上传可用性（绑了自己的桶，
     平台没配也能传）；还没拿到账号信息时退回站点级判断 */
  const canUpload = (S.account && S.account.uploadReady !== undefined)
    ? S.account.uploadReady
    : S.meta.uploadReady !== false;
  let n = 0;

  const jobs = items.map(it => {
    const rel = it.rel || it.file.name;
    const cut = rel.lastIndexOf('/');
    const j = {
      id: 'u' + Date.now() + '_' + (n++),
      file: it.file,
      name: rel,                  // 面板里显示相对路径，一眼看得出它落在哪
      size: it.file.size,
      loaded: 0,
      base,                       // 这批的目标目录，中途换目录也不影响
      relDir: cut < 0 ? '' : rel.slice(0, cut),
      parent: base
    };
    if (!canUpload) {
      // 知道了就别装不知道：连目录都不建，免得多出一片空壳
      j.status = 'fail';
      j.error = '服务器未配置对象存储，无法上传';
    } else if (it.file.size > maxB) {
      // 先在前端挡一道，省得白传 2G 再被服务端 413 拒掉
      j.status = 'fail';
      j.error = `超过上限 ${S.meta.maxUploadMB} MB`;
    } else {
      j.status = 'wait';
      j.error = '';
    }
    return j;
  });

  if (!jobs.length) return;
  S.uploads.push(...jobs);
  renderUploads();
  $('upPanel').classList.add('on');
  if (!canUpload) { toast('服务器未配置对象存储，无法上传文件'); return; }
  pump();
}

/* ================================================================
   未完成的传输：跨刷新记下来
   ----------------------------------------------------------------
   任务队列（S.uploads）只活在内存里，F5 一下全没了 —— 传了一半的
   文件既看不到进度，也不知道刚才在传什么，只能凭记忆重来。

   这里把"传了一半"的任务写进 localStorage，页面加载时读出来提示用户。

   能做到什么、做不到什么，说清楚：
     · >16MB 的文件走分片直传，OSS 上已传的分片和 localStorage 里的
       uploadId 都还在 —— 用户重新选中同一个文件就能**续传**，不用重来。
     · ≤16MB 的文件是 PostObject 一次性上传，没有断点这回事，
       只能重传。所以列表里这两种状态的措辞不一样，不骗人。
     · 浏览器不允许网页自己读本地文件，所以"继续"必须让用户再选一次文件。
       这是安全限制，绕不过去。
   ================================================================ */

const REC_KEY = 'sunlight.pending';
const MPART_MIN = 16 * 1024 * 1024;   // 和 useMpart 的阈值保持一致

const canStore = () => { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (_) { return false; } };

/** 记录未完成的传输。只存最小必要字段：File 对象本身存不了，重选时要重新匹配。
 *  带上用户名：同一台电脑换个人登录时，不该看到上一个人的文件名。 */
function persistPending() {
  if (!canStore()) return;
  try {
    const rows = S.uploads
      .filter(u => u.status === 'up' || u.status === 'wait')
      .map(u => ({
        name: u.name,
        size: u.size,
        last: (u.file && u.file.lastModified) || 0,
        loaded: u.loaded || 0,
        parent: u.parent || null,
        resumable: (u.size || 0) > MPART_MIN
      }));
    if (rows.length) {
      localStorage.setItem(REC_KEY, JSON.stringify({
        user: (S.account && S.account.username) || '',
        at: Date.now(),
        rows
      }));
    } else {
      localStorage.removeItem(REC_KEY);
    }
    S.pending = rows;          // 内存里那份跟着走，渲染不用再读一次 localStorage
  } catch (_) { /* 存不下就算了，不能因为记录失败影响上传本身 */ }
}

/** 读出上次没传完的记录。**只认当前登录账号的那一份** ——
 *  换个人登录（或退出后别人来用）时，上一个人的文件名不该露出来。 */
function loadPending() {
  if (!canStore()) return [];
  try {
    const raw = localStorage.getItem(REC_KEY);
    if (!raw) return [];
    const box = JSON.parse(raw);
    const mine = (S.account && S.account.username) || '';
    if (!box || !Array.isArray(box.rows)) return [];
    if ((box.user || '') !== mine) return [];   // 不是这个人的，直接不认
    return box.rows.filter(r => r && r.name && r.size);
  } catch (_) { return []; }
}

const clearPending = () => { try { localStorage.removeItem(REC_KEY); } catch (_) {} };

const fmtPct = (r) => {
  const pct = r.size ? Math.round((r.loaded || 0) / r.size * 100) : 0;
  return pct > 0 ? `已传 ${pct}%` : '未开始传';
};

/** 渲染「未完成」那一条。没有记录就整块藏起来 */
function renderRecovery() {
  const box = $('upRecover');
  if (!box) return;
  const recs = S.pending || [];
  if (!recs.length) { box.style.display = 'none'; box.innerHTML = ''; return; }

  const resumable = recs.filter(r => r.resumable).length;
  const head = recs.length === 1 ? '有 1 个文件没传完' : `有 ${recs.length} 个文件没传完`;
  const note = resumable
    ? '其中 ' + resumable + ' 个大的可以接着传 —— 重新选中原文件即可，已传的部分不会重来。'
    : '这些文件没有断点，只能重新上传。';

  box.style.display = '';
  box.innerHTML = `
    <div class="rc-head">
      <span class="rc-t">${esc(head)}</span>
      <button class="rc-x" id="rcDismiss" title="不再提示">忽略</button>
    </div>
    <div class="rc-note">${esc(note)}</div>
    <div class="rc-list">
      ${recs.map(r => `
        <div class="rc-item${r.resumable ? ' rs' : ''}">
          <span class="rc-name" title="${esc(r.name)}">${esc(r.name.split('/').pop())}</span>
          <span class="rc-stat">${esc(fmtSize(r.size))} · ${esc(fmtPct(r))}${r.resumable ? ' · 可续传' : ''}</span>
        </div>`).join('')}
    </div>
    <button class="rc-go" id="rcPick">选择这些文件继续</button>`;

  $('rcPick').addEventListener('click', () => {
    S.recovering = true;
    $('fileInput').click();
  });
  $('rcDismiss').addEventListener('click', () => {
    if (!confirm('忽略后这些文件的进度提示不再出现。\n\n'
      + '大文件在 OSS 上已传的分片仍然保留 —— 直接重新拖入同一个文件，照样能续传。')) return;
    S.pending = [];
    clearPending();
    renderRecovery();
  });
}

/**
 * 从重新选中的文件里恢复未完成的传输。
 *
 * 匹配顺序：先看上传时那个键（名字+大小+修改时间）能不能对上 ——
 * 对得上就说明 localStorage 里的断点还是它的，续传直接生效；
 * 对不上但名字+大小一致也收下，让它从头传（总比什么都不做强）。
 */
function restorePending(files) {
  const recs = (S.pending || []).slice();
  if (!recs.length || !files || !files.length) return false;

  const keyOf = f => (f.name || '') + '|' + f.size + '|' + (f.lastModified || 0);
  const looseOf = f => (f.name || '') + '|' + f.size;
  /* 记录里的 name 可能是 "子目录/文件名"，而选进来的 file.name 只有文件名 */
  const baseOf = n => String(n).split('/').pop();

  const picked = [...files];
  const matched = [];
  for (const r of recs) {
    const b = baseOf(r.name);
    let idx = picked.findIndex(f => keyOf(f) === b + '|' + r.size + '|' + r.last);
    if (idx < 0) idx = picked.findIndex(f => looseOf(f) === b + '|' + r.size);
    if (idx >= 0) { matched.push({ rec: r, file: picked[idx] }); picked.splice(idx, 1); }
  }
  if (!matched.length) {
    toast('选中的文件和未完成的记录对不上（名字和大小要一致）', true);
    return false;
  }

  const canUpload = (S.account && S.account.uploadReady !== undefined)
    ? S.account.uploadReady : S.meta.uploadReady !== false;
  const maxB = (S.meta.maxUploadMB || 2048) * 1048576;

  const jobs = matched.map(({ rec, file }, i) => {
    /* name 保持原来的（可能是 "子目录/文件名"），这样上传后落在同一层 */
    const cut = rec.name.lastIndexOf('/');
    const j = {
      id: 'r' + Date.now() + '_' + i,
      file,
      name: rec.name,
      size: file.size,
      loaded: 0,
      base: rec.parent || null,
      relDir: cut < 0 ? '' : rec.name.slice(0, cut),
      parent: rec.parent || null
    };
    if (!canUpload) { j.status = 'fail'; j.error = '服务器未配置对象存储，无法上传'; }
    else if (file.size > maxB) { j.status = 'fail'; j.error = `超过上限 ${S.meta.maxUploadMB} MB`; }
    else { j.status = 'wait'; j.error = ''; }
    return j;
  });

  /* 已经认领的从待办里去掉。注意这只是先算出来，真正赋值要等 renderUploads()
     之后 —— 那次渲染会把 S.pending 按其自己的口径重建。 */
  const used = new Set(matched.map(m => m.rec.name + '\u0000' + m.rec.size + '\u0000' + m.rec.last));
  const left = recs.filter(r => !used.has(r.name + '\u0000' + r.size + '\u0000' + r.last));

  S.uploads.push(...jobs);
  renderUploads();
  /* 顺序要紧：renderUploads() 里的 persistPending() 会用 S.uploads 重建
     S.pending —— 它只知道"正在传的"，会把没被认领的那几条一起抹掉。
     所以剩下的记录必须**在渲染之后**写回去。 */
  S.pending = left;
  if (left.length) {
    try {
      localStorage.setItem(REC_KEY, JSON.stringify({
        user: (S.account && S.account.username) || '', at: Date.now(), rows: left
      }));
    } catch (_) {}
  } else {
    clearPending();
  }
  renderRecovery();
  $('upPanel').classList.add('on');
  pump();
  toast(`已恢复 ${jobs.length} 个未完成的传输`);
  return true;
}

/* 页面还开着的时候刷新/关闭：问到一半就走，上传就白传了。
   有任务在传（或下载）、或者有没传完的记录，才拦一下。 */
window.addEventListener('beforeunload', e => {
  const busy = (S.uploads || []).some(u => u.status === 'up' || u.status === 'wait')
    || (S.downloads || []).some(d => d.status === 'down');
  if (!busy) return;
  e.preventDefault();
  e.returnValue = '';
  return '';
});

/* 拖进来的可能是文件，也可能是整个目录，判据是 dataTransfer 里的 entry。
   注意 entries 必须在 drop 事件里当场取出来：事件一过，DataTransferItem 就失效了。 */
function grabEntries(dt) {
  if (!dt.items || !dt.items.length) return null;
  const out = [];
  for (const it of dt.items) {
    const en = it.webkitGetAsEntry && it.webkitGetAsEntry();
    if (en) out.push(en);
  }
  return out.length ? out : null;
}

/* 把一条 entry 递归摊平。目录用它的名字当路径前缀，和 webkitRelativePath 一个口径。 */
function walkEntry(entry, prefix, out) {
  return new Promise(resolve => {
    if (entry.isFile) {
      entry.file(f => {
        out.push({ file: f, rel: (prefix ? prefix + '/' : '') + f.name });
        resolve();
      }, () => resolve());
      return;
    }
    if (!entry.isDirectory) return resolve();

    const reader = entry.createReader();
    const kids = [];
    const nextPrefix = (prefix ? prefix + '/' : '') + entry.name;
    // readEntries 一次最多给 100 条，得反复读到它返回空为止
    const drain = () => reader.readEntries(async ents => {
      if (!ents.length) {
        for (const k of kids) await walkEntry(k, nextPrefix, out);
        return resolve();
      }
      kids.push(...ents);
      drain();
    }, () => resolve());
    drain();
  });
}

async function itemsFromDrop(dt) {
  const entries = grabEntries(dt);
  if (!entries) return [...dt.files].map(f => ({ file: f, rel: f.name }));
  const out = [];
  for (const en of entries) await walkEntry(en, '', out);
  return out;
}

async function pump() {
  if (S.uploading) return;
  S.uploading = true;
  try {
    for (;;) {
      const job = S.uploads.find(u => u.status === 'wait');
      if (!job) break;
      await uploadOne(job);
      /* 撞上系统性失败（没配存储 / 掉登录）就别再一个个试了：
         用户不用看一屏红字，也不会为传不上去的文件继续建目录。 */
      if (job.fatal) {
        S.uploads.filter(u => u.status === 'wait').forEach(u => {
          u.status = 'fail';
          u.error = '已中止：' + job.error;
        });
        break;
      }
    }
  } finally {
    S.uploading = false;
    renderUploads();
    // 传完后刷新一次即可，不必每个文件都刷
    await refresh();
  }
}

async function uploadOne(job) {
  /* 真要传了才把目标目录建出来。建不出来就这条失败，后面的继续 ——
     但要是存储本身不可用，pump 会看到 fatal 直接收摊。 */
  if (job.relDir) {
    try {
      job.parent = await ensureDir(job.base || null, job.relDir);
    } catch (e) {
      job.status = 'fail';
      job.error = '建目录失败：' + e.message;
      renderUploads();
      return;
    }
  }

  /* 直传优先：字节不过服务器。大文件走分片（可断点续传），
     小文件走单件 PostObject。只有网络层失败（多半是 bucket 没配 CORS）
     才回退中转 —— 且回退一次就记住，不让后面的文件逐个再撞一遍。 */
  if (!S.directBlocked && S.meta.uploadReady !== false) {
    const useMpart = job.file.size > 16 * 1024 * 1024;
    const r = useMpart ? await directMultipartUpload(job) : await directUpload(job);
    if (r !== 'fallback') return;
    S.directBlocked = true;
    toast('对象存储直传不可用（Bucket 未配置 CORS），已切换为经服务器中转', true);
  }
  await relayUpload(job);
}

/* ---- 分片直传（大文件）：init → 分片 PUT → complete ----
   断点：分片 ETag 存 localStorage（文件名|大小|修改时间 做键）。
   重传同一个文件时先查服务端 status，OSS 上已躺着的片直接跳过。
   返回 true = 有结果；'fallback' = 让上层换中转。 */
async function directMultipartUpload(job) {
  /* 键里必须带用户名：uploadId 是跨会话有效的 OSS 资源，
     不带的话换账号登录会把上一个人的断点续到自己头上。 */
  const mpKey = 'sl_mp_' + ((S.account && S.account.username) || '') + '|'
    + (job.file.name || '') + '|' + job.file.size + '|' + job.file.lastModified;

  /* 1) 先看有没有可续传的旧会话 */
  let m = null;
  const savedId = localStorage.getItem(mpKey);
  if (savedId) {
    try {
      const st = await api('/api/upload/mpart/status?uploadId=' + encodeURIComponent(savedId));
      if (st.alive) m = { uploadId: savedId, ...st };
      else localStorage.removeItem(mpKey);
    } catch (e) { localStorage.removeItem(mpKey); }
  }

  /* 2) 没有就新开一个 */
  if (!m) {
    try {
      m = await api('/api/upload/mpart/init', {
        method: 'POST',
        body: JSON.stringify({
          name: job.file.name || 'unnamed',
          parent: job.parent,
          size: job.file.size,
          mime: job.file.type || ''
        })
      });
    } catch (e) {
      if (e.handled) { job.status = 'fail'; job.error = '登录状态已失效'; job.fatal = true; renderUploads(); return true; }
      job.status = 'fail';
      job.error = e.message;
      if (/未配置对象存储/.test(e.message || '')) job.fatal = true;
      renderUploads();
      return true;
    }
    localStorage.setItem(mpKey, m.uploadId);
  }

  /* 拿会话的工夫被暂停了：断点已存好，直接收 */
  if (job.pauseFlag || job._del) { job.status = 'paused'; renderUploads(); return true; }

  const partSize = m.partSize || 8 * 1024 * 1024;
  const total = job.file.size;
  const partCount = Math.ceil(total / partSize);

  /* 已传分片（断点续传）：号 → etag */
  const done = new Map((m.uploaded || []).map(x => [x.number, x.etag]));
  const partBytes = n => (n < partCount ? partSize : total - partSize * (partCount - 1));
  let doneBytes = 0;
  done.forEach((_, n) => { doneBytes += partBytes(n); });
  const inflight = new Map(); // number -> 已传字节（片内进度）
  const tick = () => {
    let s = doneBytes;
    inflight.forEach(v => { s += v; });
    job.loaded = Math.min(s, total);
    renderUploads();
  };

  job.status = 'up';
  renderUploads();

  /* 3) 分片 PUT：两路并发，单片重试 2 次 */
  const pending = [];
  for (let n = 1; n <= partCount; n++) if (!done.has(n)) pending.push(n);

  const putPart = async (n, url) => {
    const blob = job.file.slice((n - 1) * partSize, Math.min(n * partSize, total));
    for (let attempt = 0; attempt < 3; attempt++) {
      if (job.pauseFlag) return null;
      const etag = await new Promise(resolve => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', url, true);
        xhr.upload.onprogress = e => { inflight.set(n, e.loaded); tick(); };
        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) return resolve(xhr.getResponseHeader('ETag'));
          resolve(null);
        };
        xhr.onerror = () => resolve(null);
        /* 暂停会 abort：把这条片当没传过，断点在 localStorage / OSS 那边都还在 */
        xhr.onabort = () => resolve(null);
        xhr.send(blob);
      });
      if (etag || job.pauseFlag) return etag;
      await new Promise(r => setTimeout(r, 600 * (attempt + 1)));
    }
    return null;
  };

  /* 签名按 100 片一批拿，签完立即用 —— 15 分钟时效足够 200 片跑完 */
  for (let i = 0; i < pending.length; i += 100) {
    if (job.pauseFlag) { job.status = 'paused'; renderUploads(); return true; }
    const batch = pending.slice(i, i + 100);
    let urls;
    try {
      urls = await api('/api/upload/mpart/sign', {
        method: 'POST',
        body: JSON.stringify({ uploadId: m.uploadId, partNumbers: batch })
      });
    } catch (e) {
      if (/不存在|已过期/.test(e.message || '')) localStorage.removeItem(mpKey);
      job.status = 'fail'; job.error = e.message; renderUploads();
      return true;
    }
    const urlOf = new Map(urls.urls.map(u => [u.number, u.url]));

    const results = await new Promise(resolve => {
      const out = new Map();
      let idx = 0, active = 0;
      const next = () => {
        /* 暂停：不再派新片，等在途的收尾 */
        while (active < 2 && idx < batch.length && !job.pauseFlag) {
          const n = batch[idx++];
          active++;
          putPart(n, urlOf.get(n)).then(etag => {
            active--;
            inflight.delete(n);
            if (etag) { out.set(n, etag); doneBytes += partBytes(n); }
            tick();
            if (idx < batch.length || active) next();
            if (!active) resolve(out);
          });
        }
        if (!active) resolve(out);
      };
      next();
    });

    for (const [n, etag] of results) done.set(n, etag);
    if (job.pauseFlag) {
      /* 断点只存 uploadId：已传的片以 OSS listParts 为准，续传时从 status 接口拿回 */
      job.status = 'paused';
      renderUploads();
      return true;
    }
    if (results.size < batch.length) {
      /* 有片最终失败：断点已存，重传同一文件可续 */
      job.status = 'fail';
      job.error = '部分分片上传失败，重新上传该文件将从断点继续';
      renderUploads();
      return true;
    }
  }

  /* 4) 合并落树 */
  try {
    const d = await api('/api/upload/mpart/complete', {
      method: 'POST',
      body: JSON.stringify({
        uploadId: m.uploadId,
        parts: [...done].map(([number, etag]) => ({ number, etag }))
      })
    });
    localStorage.removeItem(mpKey);
    job.status = 'done';
    job.loaded = total;
    if (d.node && d.node.name !== job.file.name) job.renamed = d.node.name;
    renderUploads();
    return true;
  } catch (e) {
    job.status = 'fail';
    job.error = e.message;
    renderUploads();
    return true;
  }
}

/* ---- 直传：拿凭证 → POST 到 OSS → complete 落树 ----
   返回 true = 这条有了结果（成功或失败都算）；'fallback' = 让上层换中转。 */
async function directUpload(job) {
  let pol;
  try {
    pol = await api('/api/upload/policy', {
      method: 'POST',
      body: JSON.stringify({ name: job.file.name || 'unnamed', parent: job.parent, size: job.file.size })
    });
  } catch (e) {
    if (e.handled) { job.status = 'fail'; job.error = '登录状态已失效'; job.fatal = true; renderUploads(); return true; }
    // 服务端明确拒绝（没配存储/超限/名字非法）—— 换中转也是同样下场
    job.status = 'fail';
    job.error = e.message;
    if (/未配置对象存储/.test(e.message || '')) job.fatal = true;
    renderUploads();
    return true;
  }

  /* 拿凭证的工夫被暂停了：直接收，别把字节发出去 */
  if (job.pauseFlag || job._del) { job.status = 'paused'; renderUploads(); return true; }

  job.status = 'up';
  renderUploads();

  return await new Promise(resolve => {
    const fd = new FormData();
    for (const [k, v] of Object.entries(pol.fields)) fd.append(k, v);
    fd.append('file', job.file);

    const xhr = new XMLHttpRequest();
    job._xhr = xhr;
    xhr.open('POST', 'https://' + pol.host + '/', true);

    xhr.upload.onprogress = e => {
      if (e.lengthComputable) { job.loaded = e.loaded; renderUploads(); }
    };

    const pausedNow = () => {
      /* 单件 PostObject 不支持断点：继续时从头再传。旧 policy 会话留给清扫回收 */
      job.status = 'paused';
      renderUploads();
      resolve(true);
    };

    xhr.onload = async () => {
      if (xhr.status === 200) {
        try {
          const d = await api('/api/upload/complete', {
            method: 'POST',
            body: JSON.stringify({ uploadId: pol.uploadId, mime: job.file.type || '' })
          });
          job.status = 'done';
          job.loaded = job.size;
          if (d.node && d.node.name !== job.file.name) job.renamed = d.node.name;
          renderUploads();
          resolve(true);
        } catch (e) {
          job.status = 'fail';
          job.error = e.message;
          renderUploads();
          resolve(true);
        }
      } else if (xhr.status === 0) {
        // 网络层失败：浏览器连 OSS 都没握上手，九成是 bucket 没配 CORS
        if (job.pauseFlag || job._del) return pausedNow();
        resolve('fallback');
      } else {
        job.status = 'fail';
        job.error = '直传失败（' + xhr.status + '），检查 bucket 的 CORS 与 RAM 权限';
        renderUploads();
        resolve(true);
      }
    };
    xhr.onerror = () => {
      if (job.pauseFlag || job._del) return pausedNow();
      resolve('fallback');
    };

    xhr.send(fd);
  });
}

/* ---- 中转（原路径）：浏览器 → 本服务 → OSS ---- */
function relayUpload(job) {
  return new Promise(resolve => {
    if (job.pauseFlag || job._del) { job.status = 'paused'; renderUploads(); resolve(); return; }
    job.status = 'up';
    renderUploads();

    const q = new URLSearchParams();
    if (job.parent) q.set('parent', job.parent);
    q.set('name', job.file.name || 'unnamed');

    const xhr = new XMLHttpRequest();
    job._xhr = xhr;
    xhr.open('POST', '/api/upload?' + q.toString(), true);
    xhr.setRequestHeader('Authorization', 'Bearer ' + S.token);

    xhr.upload.onprogress = e => {
      if (e.lengthComputable) { job.loaded = e.loaded; renderUploads(); }
    };

    xhr.onload = () => {
      let data = null;
      try { data = JSON.parse(xhr.responseText); } catch (_) {}
      if (xhr.status === 401) {
        job.status = 'fail'; job.error = '登录状态已失效'; job.fatal = true;
      } else if (xhr.status >= 200 && xhr.status < 300 && data && data.ok) {
        job.status = 'done';
        job.loaded = job.size;
        // job.name 是相对路径（可能带目录），判断重名得拿真实文件名去比
        if (data.node && data.node.name !== job.file.name) job.renamed = data.node.name;
      } else {
        job.status = 'fail';
        job.error = (data && data.error) || ('上传失败（' + xhr.status + '）');
        // 503 = 服务端这边就传不了（没配对象存储），后面那些也别试了
        if (xhr.status === 503) job.fatal = true;
      }
      renderUploads();
      resolve();
    };

    xhr.onerror = () => { job.status = 'fail'; job.error = '网络中断'; renderUploads(); resolve(); };
    xhr.onabort = () => {
      if (job.pauseFlag || job._del) {
        job.status = 'paused'; job.error = '';
      } else {
        job.status = 'fail'; job.error = '已取消';
      }
      renderUploads(); resolve();
    };

    // 直接用 File 作为 body，浏览器会自动带上 Content-Length ——
    // 服务端要靠它判断大小上限，缺了会返回 411
    xhr.send(job.file);
  });
}

/* 传输任务的操作按钮。kind: 'up' | 'dl' */
function taskActs(kind, t) {
  const busy = t.status === 'up' || t.status === 'wait' || t.status === 'down';
  const b = (act, label) => `<button class="up-act" data-tkind="${kind}" data-tact="${act}" data-tid="${esc(t.tid || t.id)}">${label}</button>`;
  if (busy) return b('pause', '暂停') + b('del', '删除');
  if (t.status === 'paused') return b('resume', '继续') + b('del', '删除');
  return b('del', '删除');
}

function renderUploads() {
  const ups = S.uploads, dls = S.downloads || [];
  const total = ups.length + dls.length;

  /* 每次状态变化都记一遍"还剩哪些没传完"。
     所有状态迁移最后都会走到 renderUploads()，所以挂在这里一处就够，
     不用在每个改 status 的地方各写一次（那样迟早会漏）。 */
  persistPending();
  renderRecovery();

  /* 没有任务时**不隐藏面板**，而是显示空状态。
     以前直接 return 掉（摘掉 .on），但顶栏那个按钮是 classList.toggle('on')，
     它会把面板强行打开、却没人渲染内容 —— 结果就是空列表加两条贴在一起的
     边框。现在渲染归渲染、显隐归显隐，两边不再打架。 */
  if (!total) {
    $('upList').innerHTML = `<div class="up-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
      <span class="t1">暂无传输任务</span>
      <span class="t2">把文件拖进页面，或点顶栏的上传按钮</span>
    </div>`;
    $('upFoot').style.display = 'none';
    $('upTitle').textContent = '传输中心';
    return;
  }

  $('upFoot').style.display = '';

  const upBusy = ups.filter(u => u.status === 'up' || u.status === 'wait').length;
  const dlBusy = dls.filter(d => d.status === 'down').length;
  const upDone = ups.filter(u => u.status === 'done').length;
  const upFail = ups.filter(u => u.status === 'fail').length;
  const dlDone = dls.filter(d => d.status === 'done').length;
  const dlFail = dls.filter(d => d.status === 'fail').length;

  $('upTitle').textContent = (upBusy || dlBusy) ? `正在传输 ${upBusy + dlBusy} 项` : '传输完成';
  $('upSum').textContent = [
    ups.length ? `上传 ${upDone} 成功${upFail ? ` · ${upFail} 失败` : ''}` : '',
    dls.length ? `下载 ${dlDone} 成功${dlFail ? ` · ${dlFail} 失败` : ''}` : ''
  ].filter(Boolean).join('  ·  ') || '—';

  const row = (kind, t) => {
    const cur = t.status === 'done' ? t.size : t.loaded;
    const pct = t.size ? Math.round(cur / t.size * 100) : (t.status === 'done' ? 100 : 0);
    const cls = t.status === 'done' ? ' done' : (t.status === 'fail' ? ' fail' : (t.status === 'paused' ? ' pause' : ''));
    let stat;
    if (t.status === 'done') stat = t.renamed || '完成';
    else if (t.status === 'fail') stat = t.error;
    else if (t.status === 'paused') stat = '已暂停' + (t.size ? ' · ' + fmtSize(t.loaded) + ' / ' + fmtSize(t.size) : '');
    else if (t.status === 'wait') stat = '等待中';
    else stat = fmtSize(t.loaded) + (t.size ? ' / ' + fmtSize(t.size) : '');
    const statCls = t.status === 'done' ? ' ok' : (t.status === 'fail' ? ' bad' : '');
    return `<div class="up-item${cls}">
      <div class="up-top">
        <span class="up-name" title="${esc(t.name)}">${esc(t.name)}</span>
        <span class="up-stat${statCls}" title="${esc(t.error || '')}">${esc(stat)}</span>
        <span class="up-acts">${taskActs(kind, t)}</span>
      </div>
      <div class="up-bar"><div class="up-fill" style="width:${pct}%"></div></div>
    </div>`;
  };

  $('upList').innerHTML =
    (ups.length ? '<div class="up-sec">上传</div>' : '')
    + ups.map(u => row('up', u)).join('')
    + (dls.length ? '<div class="up-sec">下载</div>' : '')
    + dls.map(d => row('dl', d)).join('');
}

/* 传输任务的 暂停/继续/删除 */
function pauseUpload(u) {
  if (u.status === 'wait') { u.status = 'paused'; renderUploads(); return; }
  if (u.status !== 'up') return;
  u.pauseFlag = true;
  if (u._xhr) { try { u._xhr.abort(); } catch (_) {} }
  /* 分片上传的循环自己会观察到 pauseFlag 并把任务置为 paused */
}
function resumeUpload(u) {
  if (u.status !== 'paused') return;
  u.pauseFlag = false; u._del = false;
  u.status = 'wait';
  renderUploads();
  pump();
}
function deleteUpload(u) {
  if (u.status === 'up' || u.status === 'wait') {
    u._del = true; u.pauseFlag = true;
    if (u._xhr) { try { u._xhr.abort(); } catch (_) {} }
  }
  S.uploads = S.uploads.filter(x => x !== u);
  renderUploads();
}

/* ================================================================
   刷新
   ================================================================ */
async function refresh() {
  await loadFlat().catch(() => {});
  try {
    await loadDir(S.parent);
  } catch (e) {
    // 当前目录在别处被删了（或本机另开一个标签页操作过），退回顶层，别黑屏
    if (!e.handled) await loadDir(null).catch(() => {});
  }
  if (S.q.trim()) runSearch(S.q);
}

/* ================================================================
   搜索
   ================================================================ */
/* 当前目录的整棵子树（含它下面的每一层）。
   传空的 rootId 表示根目录 —— 那就是全部，不必算，直接返回 null 让调用方跳过筛选。 */
function subtreeIds(rootId) {
  if (!rootId) return null;
  const kids = new Map();
  S.flat.forEach(n => {
    const p = n.parent || '__root';
    if (!kids.has(p)) kids.set(p, []);
    kids.get(p).push(n.id);
  });
  const out = new Set();
  const stack = [...(kids.get(rootId) || [])];
  while (stack.length) {
    const id = stack.pop();
    if (out.has(id)) continue;
    out.add(id);
    (kids.get(id) || []).forEach(c => stack.push(c));
  }
  return out;
}

/* 搜索只扫「当前文件夹往下的这一支」。
   原来是全局扫 S.flat：人在某个子目录里打字，别的分支的结果也会冒出来，
   只能靠结果行上的路径自己认。现在范围就是眼前这层往下。 */
function runSearch(q) {
  S.q = q;
  const kw = q.trim().toLowerCase();
  if (!kw) { S.hits = null; render(); return; }
  const scope = subtreeIds(S.parent);
  S.hits = S.flat.filter(n =>
    (!scope || scope.has(n.id)) && n.name.toLowerCase().includes(kw));
  S.sel.clear();
  render();
}

/* 搜索范围跟着目录走，占位符也换个说法，免得以为还在全局搜 */
function syncSearchTip() {
  $('q').placeholder = S.parent
    ? `在「${currentDirName()}」中搜索…`
    : '搜索全部文件与文件夹…';
}

/* ================================================================
   浮动菜单
   ================================================================ */
const menu = $('menu');
/* 关的时候把 className 整个重置，不只是摘掉 .on ——
   菜单容器同时被文件菜单和账号菜单用，带着上一个的修饰类
   开下一个，宽度之类会串味。 */
function closeMenu() {
  menu.className = 'menu';
  menu.innerHTML = '';
  $('btnProfile').setAttribute('aria-expanded', 'false');
  $('btnUpload').setAttribute('aria-expanded', 'false');
}

function openMenu(btn, id) {
  const node = S.children.concat(S.flat, S.hits || []).find(n => n.id === id);
  if (!node) return;
  const isDir = node.type === 'folder';

  const items = [];
  /* 预览放最前：点开先看是这个页面上最常用的动作。
     node.pv 由服务端下发（白名单在 lib/preview.js），空 = 这个类型看不了 ——
     那就不要摆一个点了报错的入口。 */
  if (!isDir && node.pv) items.push({ k: 'pv', icon: I.eye, label: '预览' });
  if (!isDir) items.push({ k: 'dl', icon: I.dl, label: '下载' });
  items.push({ k: 'share', icon: I.share, label: '分享' });
  items.push({ k: 'rename', icon: I.rename, label: '重命名' });
  items.push({ k: 'move', icon: I.move, label: '移动到…' });
  if (!isDir && node.sha256) items.push({ k: 'hash', icon: I.hash, label: '校验完整性' });
  if (isDir) items.push({ k: 'open', icon: I.folder, label: '打开' });
  items.push({ hr: true });
  items.push({ k: 'del', icon: I.trash, label: '删除', danger: true });

  menu.className = 'menu on';
  menu.innerHTML = items.map(it => it.hr
    ? '<div class="hr"></div>'
    : `<button data-k="${it.k}" class="${it.danger ? 'danger' : ''}">${it.icon}${esc(it.label)}</button>`
  ).join('');

  // 贴着按钮放，超出视口就翻到另一侧
  const r = btn.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = r.right - mw;
  let top = r.bottom + 6;
  if (left < 8) left = 8;
  if (left + mw > innerWidth - 8) left = innerWidth - mw - 8;
  if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';

  menu.onclick = e => {
    const b = e.target.closest('[data-k]');
    if (!b) return;
    const k = b.dataset.k;
    closeMenu();
    if (k === 'pv') openPreview(id);
    else if (k === 'dl') downloadNode(id);
    else if (k === 'share') shareNodes([id]);
    else if (k === 'rename') renameNode(id);
    else if (k === 'move') moveNodes([id]);
    else if (k === 'del') deleteNodes([id]);
    else if (k === 'hash') verifySheet(id);
    else if (k === 'open') gotoDir(id);
  };
}

/* ================================================================
   导航
   ================================================================ */
/* 最近一次进目录的时刻。双击处理要用它，见下面的 dblclick */
let navAt = 0;

async function gotoDir(id) {
  navAt = Date.now();
  $('q').value = '';
  S.q = ''; S.hits = null;
  try {
    await loadDir(id === '__root' ? null : id);
    scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    if (!e.handled) toast(e.message, true);
  }
}

/* ================================================================
   事件绑定
   ================================================================ */
/* 列表 / 网格里的点击 */
$('panel').addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if (act) {
    if (act.dataset.act === 'upload') $('fileInput').click();
    else if (act.dataset.act === 'uploadDir') $('fileDirInput').click();
    else if (act.dataset.act === 'newfolder') newFolder();
    return;
  }

  const sortBtn = e.target.closest('[data-sort]');
  if (sortBtn) {
    const k = sortBtn.dataset.sort;
    if (S.sort === k) {
      // 同一个字段再点一下 = 反过来看
      S.sortDir = sortDirOf() === 'asc' ? 'desc' : 'asc';
    } else {
      S.sort = k;
      S.sortDir = '';            // 换字段就回到它的默认方向
    }
    saveSort(S.sort);
    saveSortDir(S.sortDir);
    renderPanel();
    return;
  }

  const cb = e.target.closest('[data-cb]');
  if (cb) {
    const id = cb.dataset.cb;
    if (id === '__all') return selectAll(!(S.sel.size === currentList().length && S.sel.size > 0));
    toggleSel(id, 'toggle');
    return;
  }

  const mb = e.target.closest('[data-menu]');
  if (mb) { e.stopPropagation(); return openMenu(mb, mb.dataset.menu); }

  const row = e.target.closest('[data-id]');
  if (!row) return;
  const id = row.dataset.id;

  if (e.shiftKey && S.lastClick) return rangeSel(id);
  if (e.ctrlKey || e.metaKey) return toggleSel(id, 'toggle');

  /* 单击文件夹 = 进去。
     早先这里是「单击一律选中」，于是想进目录的人被选中了，还以为是点错了地方。
     文件夹最常做的动作就是进去，所以把这一个动作给它。
     要「选中文件夹」（分享 / 删除整个文件夹）用左边的勾选框 —— 那个入口一直在，
     两种意图就不会再抢同一次点击。文件单击仍是选中，不会误触发下载。 */
  const node = currentList().find(n => n.id === id);
  if (node && node.type === 'folder') return gotoDir(id);

  toggleSel(id, 'replace');
});

/* 双击：文件 = 打开预览（能预览的话），不能预览的仍旧直接下载。
   想拿原文件走「⋯ → 下载」或右键——预览在弹层里也留了下载按钮。
   文件夹单击就进去了（见上面的 click），这里带一个时间窗防护 ——
   双击文件夹时第一下已经把列表换掉了，第二下落在新列表的行上，
   有些浏览器仍会补一个 dblclick，不加防护会一口气进两层。 */
$('panel').addEventListener('dblclick', e => {
  if (e.target.closest('[data-cb]') || e.target.closest('[data-menu]')) return;
  const row = e.target.closest('[data-id]');
  if (!row) return;
  const id = row.dataset.id;
  const node = currentList().find(n => n.id === id);
  if (!node) return;
  if (node.type === 'folder') {
    if (Date.now() - navAt < 600) return;
    return gotoDir(id);
  }
  /* node.pv 是服务端下发的预览类别；空 = 这个类型看不了，直接下载更友好 */
  if (node.pv) return openPreview(id);
  downloadNode(id);
});

$('crumbs').addEventListener('click', e => {
  const a = e.target.closest('[data-go]');
  if (a) gotoDir(a.dataset.go);
});

$('q').addEventListener('input', e => {
  clearTimeout(S.qTimer);
  const v = e.target.value;
  // 本地过滤，防抖是为了 153 个节点也别在每次按键都重排 DOM
  S.qTimer = setTimeout(() => runSearch(v), 120);
});

$('btnView').addEventListener('click', () => {
  S.view = S.view === 'list' ? 'grid' : 'list';
  saveView(S.view);
  render();
});

/* 返回上一级 = 进当前目录的父目录 */
$('btnBack').addEventListener('click', () => {
  if (!S.parent) return;
  gotoDir(S.current && S.current.parent ? S.current.parent : '__root');
});

$('btnNewFolder').addEventListener('click', newFolder);
$('btnUpload').addEventListener('click', e => {
  e.stopPropagation();     // 别让「点空白收起菜单」那条顺手把它关掉
  if (menu.classList.contains('on') && menu.classList.contains('up-menu')) return closeMenu();
  openUploadMenu($('btnUpload'));
});
$('btnShares').addEventListener('click', shareManager);

$('fileInput').addEventListener('change', e => {
  const files = [...e.target.files];
  e.target.value = '';       // 允许连续选同一个文件
  /* 「继续上次没传完的」走的也是这个输入框：先把选中的文件对回记录。
     对上了就不再当新任务入队（否则会重传一遍，白费已传的分片）。 */
  if (S.recovering) {
    S.recovering = false;
    if (files.length && restorePending(files)) return;
  }
  const items = files.map(f => ({ file: f, rel: f.name }));
  if (items.length) enqueueUploads(items, S.parent);
});

/* 选文件夹：webkitRelativePath 自带目录层级，交给同一条上传流水线还原 */
$('fileDirInput').addEventListener('change', e => {
  const items = [...e.target.files].map(f => ({ file: f, rel: f.webkitRelativePath || f.name }));
  e.target.value = '';
  if (items.length) enqueueUploads(items, S.parent);
});

$('selNone').addEventListener('click', () => { S.sel.clear(); renderPanel(); renderSelBar(); });
$('selDl').addEventListener('click', () => { const n = selNodes()[0]; if (n) downloadNode(n.id); });
$('selShare').addEventListener('click', () => shareNodes([...S.sel]));
$('selMove').addEventListener('click', () => moveNodes([...S.sel]));
$('selDel').addEventListener('click', () => deleteNodes([...S.sel]));

/* 收起：X 就是"把面板关掉"，不再兼职"清空任务"。
   以前它靠清空列表 + renderUploads() 里那句 remove('on') 顺手把面板藏起来，
   现在 renderUploads 改成了渲染空状态、不再动显隐，那条隐式路径就断了 ——
   X 点了没反应。职责分开：X 负责收，底部的「清空已完成」负责清。 */
$('upClose').addEventListener('click', () => {
  if (S.uploads.some(u => u.status === 'up' || u.status === 'wait')
    || S.downloads.some(d => d.status === 'down')) return toast('还有任务在传输中', true);
  $('upPanel').classList.remove('on');
});
$('upClear').addEventListener('click', () => {
  S.uploads = S.uploads.filter(u => u.status === 'up' || u.status === 'wait' || u.status === 'paused');
  S.downloads = S.downloads.filter(d => d.status === 'down' || d.status === 'paused');
  renderUploads();
});

/* 传输任务的按钮：暂停 / 继续 / 删除 */
$('upList').addEventListener('click', e => {
  const b = e.target.closest('[data-tact]');
  if (!b) return;
  const id = b.dataset.tid;
  if (b.dataset.tkind === 'up') {
    const u = S.uploads.find(x => x.id === id);
    if (!u) return;
    if (b.dataset.tact === 'pause') pauseUpload(u);
    else if (b.dataset.tact === 'resume') resumeUpload(u);
    else deleteUpload(u);
  } else {
    const d = S.downloads.find(x => x.tid === id);
    if (!d) return;
    if (b.dataset.tact === 'pause') pauseDownload(d);
    else if (b.dataset.tact === 'resume') resumeDownload(d);
    else deleteDownload(d);
  }
});

/* 顶栏入口：随时打开传输中心。打开前先渲染一遍 —— 面板可能是被 toggle
   强行点开的，那时列表里还什么都没有，需要空状态顶上。 */
$('btnTransfers').addEventListener('click', () => {
  const p = $('upPanel');
  const willOpen = !p.classList.contains('on');
  if (willOpen) renderUploads();
  p.classList.toggle('on');
});

/* 点空白处收起菜单、取消选择 */
document.addEventListener('click', e => {
  if (!e.target.closest('#menu') && !e.target.closest('[data-menu]')) closeMenu();
});
$('panel').addEventListener('mousedown', e => {
  if (e.target === $('panel') || e.target.id === 'rows' || e.target.classList.contains('rows')
    || e.target.classList.contains('grid')) {
    S.sel.clear(); renderPanel(); renderSelBar();
  }
});
window.addEventListener('scroll', closeMenu, true);
/* 视口一变就把菜单收掉。菜单是按按钮当时的位置算的固定坐标，
   转屏或改窗口大小之后那个坐标就作废了 —— 不收的话它会飘到屏幕外面，
   看起来像"点了头像什么都没出来"。 */
window.addEventListener('resize', closeMenu);

/* Esc / Delete / F2 / Ctrl+A */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (menu.classList.contains('on')) return closeMenu();
    if (modal.classList.contains('on')) return closeSheet();
    if (S.sel.size) { S.sel.clear(); renderPanel(); renderSelBar(); }
    return;
  }
  if (modal.classList.contains('on')) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (typing) return;

  if (e.key === 'Delete' && S.sel.size) { e.preventDefault(); deleteNodes([...S.sel]); }
  else if (e.key === 'F2' && S.sel.size === 1) { e.preventDefault(); renameNode([...S.sel][0]); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { e.preventDefault(); selectAll(true); }
});

/* 复制 */
document.addEventListener('click', async e => {
  const c = e.target.closest('[data-copy]');
  if (c) {
    const v = c.dataset.copy;
    try {
      await navigator.clipboard.writeText(v);
      toast('已复制');
    } catch (_) {
      // 非 https 或老浏览器下 clipboard 不可用，退回到选中文本让用户自己按 Ctrl+C
      const ta = document.createElement('textarea');
      ta.value = v; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('已复制'); }
      catch (_2) { toast('复制失败，请手动复制', true); }
      ta.remove();
    }
    return;
  }

  const rv = e.target.closest('[data-revoke]');
  if (rv) revokeShare(rv.dataset.revoke, rv);

  const ex = e.target.closest('[data-extend]');
  if (ex) extendShareSheet(ex.dataset.extend);

  const rp = e.target.closest('[data-rpw]');
  if (rp) changeSharePwSheet(rp.dataset.rpw);

  /* 密码默认星号，点一下显示、再点隐藏 */
  const pwEl = e.target.closest('.rv.pw[data-pw]');
  if (pwEl && pwEl.dataset.pw) {
    const shown = pwEl.dataset.shown === '1';
    pwEl.textContent = shown ? '••••••' : pwEl.dataset.pw;
    pwEl.dataset.shown = shown ? '' : '1';
    return;
  }
});

/* ================================================================
   拖拽
   ================================================================ */
const dropZone = $('drop');
const panelEl = $('panel');
const crumbsEl = $('crumbs');
let dragIds = null;                 // 正在拖的内部节点（用于移动）

/* ---------------------------------------------------------------
   两种拖拽要分清楚，判据是 dataTransfer.types：
     带 'Files'  → 从操作系统拖文件进来，走"上传"
     只有 text   → 拖的是页面里的节点，走"移动"
   混在一起会让拖文件进来时触发移动逻辑。
   --------------------------------------------------------------- */
const isOsFileDrag = e => !!(e.dataTransfer && [...e.dataTransfer.types].includes('Files'));

/* ---- 一、从系统拖文件进来 → 上传 ---- */
let osDragTimer = null;
function showDropUI() {
  $('dropSub').textContent = `将保存到「${currentDirName()}」`;
  dropZone.classList.add('on');
}
function hideDropUI() {
  clearTimeout(osDragTimer);
  dropZone.classList.remove('on');
  panelEl.querySelectorAll('.drop-on').forEach(el => el.classList.remove('drop-on'));
  crumbsEl.querySelectorAll('.drop-on').forEach(el => el.classList.remove('drop-on'));
}
/* 用"最后一次 dragover 之后 250ms 收起"代替计数：
   计数法在子元素上会各加一次，进出不平衡时投放层会卡住不消失。 */
function bumpDropUI() {
  showDropUI();
  clearTimeout(osDragTimer);
  osDragTimer = setTimeout(hideDropUI, 250);
}

window.addEventListener('dragenter', e => { if (isOsFileDrag(e)) bumpDropUI(); });
window.addEventListener('dragover', e => {
  if (!isOsFileDrag(e)) return;
  // 不拦的话浏览器会直接打开这个文件
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  bumpDropUI();
});
window.addEventListener('dragleave', e => {
  if (!isOsFileDrag(e)) return;
  // 离开整个窗口（而不是在子元素之间移动）才收起
  if (!e.relatedTarget) hideDropUI();
});
window.addEventListener('drop', e => {
  if (!isOsFileDrag(e)) return;
  e.preventDefault();
  hideDropUI();
  // entries 只能在事件里当场取，所以这里直接把 DataTransfer 交出去
  itemsFromDrop(e.dataTransfer).then(items => {
    if (items.length) enqueueUploads(items, S.parent);
  });
});

/* 拖到某个文件夹上 → 直接传进那个文件夹，不用先进去 */
panelEl.addEventListener('dragover', e => {
  if (!isOsFileDrag(e)) return;
  const t = folderUnder(e);
  panelEl.querySelectorAll('.drop-on').forEach(el => el.classList.remove('drop-on'));
  if (t) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    markDropOn(t);
  }
});
panelEl.addEventListener('drop', e => {
  if (!isOsFileDrag(e)) return;
  const t = folderUnder(e);
  if (!t) return;                        // 没落在文件夹上 → 交给 window 处理，传到当前目录
  e.preventDefault();
  e.stopPropagation();
  hideDropUI();
  itemsFromDrop(e.dataTransfer).then(items => {
    if (items.length) enqueueUploads(items, t);
  });
});

/* ---- 二、页面内的节点拖到文件夹上 → 移动 ---- */
panelEl.addEventListener('dragstart', e => {
  const row = e.target.closest('[data-id]');
  if (!row) return;
  const id = row.dataset.id;
  // 拖已选中的项 → 整批一起拖；拖没选中的 → 只拖它
  dragIds = S.sel.has(id) ? [...S.sel] : [id];
  if (!S.sel.has(id)) { S.sel.clear(); S.sel.add(id); renderPanel(); renderSelBar(); }
  try {
    e.dataTransfer.setData('text/plain', dragIds.join(','));
    e.dataTransfer.effectAllowed = 'move';
  } catch (_) {}
  panelEl.querySelectorAll('[data-id]').forEach(el => {
    if (dragIds.includes(el.dataset.id)) el.classList.add('dragging');
  });
});

panelEl.addEventListener('dragend', () => {
  dragIds = null;
  clearMarks();
});

/* 当前指针下面是哪个文件夹（不能是正在拖的那个） */
function folderUnder(e) {
  const el = e.target.closest('[data-id]');
  if (!el) return null;
  const id = el.dataset.id;
  if (dragIds && dragIds.includes(id)) return null;
  const node = currentList().find(n => n.id === id);
  return node && node.type === 'folder' ? id : null;
}
const markDropOn = id => panelEl.querySelectorAll(`[data-id="${CSS.escape(id)}"]`).forEach(el => el.classList.add('drop-on'));
const clearMarks = () => {
  panelEl.querySelectorAll('.dragging,.drop-on').forEach(el => el.classList.remove('dragging', 'drop-on'));
  crumbsEl.querySelectorAll('.drop-on').forEach(el => el.classList.remove('drop-on'));
};

panelEl.addEventListener('dragover', e => {
  if (!dragIds) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const t = folderUnder(e);
  panelEl.querySelectorAll('.drop-on').forEach(el => { if (el.dataset.id !== t) el.classList.remove('drop-on'); });
  if (t) markDropOn(t);
});

panelEl.addEventListener('drop', e => {
  if (!dragIds) return;
  e.preventDefault();
  e.stopPropagation();
  const t = folderUnder(e);
  const ids = dragIds;
  dragIds = null;
  clearMarks();
  if (t) moveNodesTo(ids, t);
});

/* 拖到面包屑上 → 往上移动（夸克也有这个手势，省得层层点回去再拖） */
crumbsEl.addEventListener('dragover', e => {
  if (!dragIds) return;
  const c = e.target.closest('[data-drop]');
  if (!c) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  crumbsEl.querySelectorAll('.drop-on').forEach(el => el.classList.remove('drop-on'));
  c.classList.add('drop-on');
});
crumbsEl.addEventListener('dragleave', () => {
  crumbsEl.querySelectorAll('.drop-on').forEach(el => el.classList.remove('drop-on'));
});
crumbsEl.addEventListener('drop', e => {
  if (!dragIds) return;
  e.preventDefault();
  e.stopPropagation();
  const c = e.target.closest('[data-drop]');
  const ids = dragIds;
  dragIds = null;
  clearMarks();
  if (!c) return;
  const target = c.dataset.drop === '__root' ? null : c.dataset.drop;
  moveNodesTo(ids, target);
});

async function moveNodesTo(ids, parent) {
  parent = parent || null;
  // 已经在目标目录里就别白跑一趟接口（服务端会当无事发生，但用户会看到一次无意义的刷新）
  const byId = new Map(S.flat.map(n => [n.id, n]));
  if (ids.every(id => (byId.get(id) || {}).parent === parent)) return;

  try {
    const r = await api('/api/move', { method: 'POST', body: JSON.stringify({ ids, parent }) });
    await refresh();
    const renamed = (r.nodes || []).filter(n => {
      const before = byId.get(n.id);
      return before && before.name !== n.name;
    });
    toast(renamed.length
      ? `已移动，${renamed.length} 项因重名自动重命名（如「${renamed[0].name}」）`
      : `已移动 ${ids.length} 项`);
  } catch (e) {
    if (!e.handled) toast(e.message, true);
  }
}

/* ================================================================
   主题
   ================================================================ */
(function initTheme() {
  let t = null;
  try { t = localStorage.getItem('sunlight.theme'); } catch (_) {}
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
$('btnTheme').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('sunlight.theme', next); } catch (_) {}
});

/* ================================================================
   登录
   ================================================================ */
const gateErrEl = $('gateErr');
let challenge = '';
let periodTimer = null;
let challengeLeft = 0;

function gateErr(msg) {
  gateErrEl.textContent = msg;
  gateErrEl.classList.add('on');
}

function gotoStep(n) {
  clearInterval(periodTimer);
  $('step1').style.display = n === 1 ? 'block' : 'none';
  $('step2').style.display = n === 2 ? 'block' : 'none';
  $('step3').style.display = n === 3 ? 'block' : 'none';
  $('gateErr').classList.remove('on');
  if (n === 1) {
    /* 品牌名归 init() 按 S.meta.brand 填，这里不再插手 ——
       原来这里写死过 'sunlight'，会把真实品牌名覆盖掉 */
    setTimeout(() => ($('user').value ? $('pwd') : $('user')).focus(), 60);
  } else if (n === 3) {
    setTimeout(() => $('suUser').focus(), 60);
  } else {
    $('code').value = '';
    setTimeout(() => $('code').focus(), 60);
    challengeLeft = S.meta.challengeTtl || 120;
    tickPeriod();
    periodTimer = setInterval(tickPeriod, 500);
  }
}

/* 动态码每 30 秒换一次，把剩余时间画出来 */
function tickPeriod() {
  const period = S.meta.period || 30;
  const left = period - (Math.floor(Date.now() / 1000) % period);
  const pct = left / period * 100;
  $('periodFill').style.width = pct + '%';
  challengeLeft -= 0.5;
  if (challengeLeft <= 0) {
    clearInterval(periodTimer);
    gotoStep(1);
    return gateErr('验证超时，请重新输入密码');
  }
  $('periodTxt').textContent = `本组还剩 ${left} 秒 · 本次验证 ${Math.max(0, Math.ceil(challengeLeft))} 秒后失效`;
}

function unlock() {
  $('gate').classList.add('off');
  $('app').classList.add('on');
  $('user').value = '';
  $('pwd').value = '';
  $('suUser').value = '';
  $('suPwd').value = '';
  $('suPwd2').value = '';
  $('code').value = '';
  clearInterval(periodTimer);
  gateErrEl.classList.remove('on');
}

async function submitPwd() {
  const u = $('user').value.trim();
  const v = $('pwd').value;
  if (!u) return gateErr('请输入用户名');
  if (!v) return gateErr('请输入密码');
  const btn = $('pwdBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  gateErrEl.classList.remove('on');

  try {
    const { status, data } = await authPost('/api/auth', { username: u, password: v });

    if (status === 200 && data.ok && data.needTotp) {
      challenge = data.challenge;
      if (data.period) S.meta.period = data.period;
      if (data.ttl) S.meta.challengeTtl = data.ttl;
      gotoStep(2);
      return;
    }
    if (status === 200 && data.ok && data.token) {
      S.token = data.token;
      saveToken(data.token);
      saveLastUser(u);
      unlock();
      await boot();
      returnToNext();   // 从分享页来的就跳回去，没有 next 时是空操作
      return;
    }
    if (status === 429) return gateErr(data.error || '尝试过于频繁，请稍后再试');
    if (status === 401) return gateErr(data.error || '用户名或密码不正确');
    gateErr(data.error || ('服务异常（' + status + '）'));
  } catch (e) {
    if (!e.handled) gateErr('无法连接服务器：' + e.message);
  } finally {
    btn.disabled = false; btn.innerHTML = '<span class="lbl">登录</span>';
  }
}

/** 注册。成功后服务端直接给票，不用再跑一趟登录页 */
async function submitSignup() {
  const u = $('suUser').value.trim();
  const p = $('suPwd').value;
  const p2 = $('suPwd2').value;

  if (!u) return gateErr('请输入用户名');
  if (p.length < (S.meta.passwordMin || 8)) return gateErr(`密码至少 ${S.meta.passwordMin || 8} 位`);
  if (p !== p2) return gateErr('两次输入的密码不一致');

  const btn = $('suBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  gateErrEl.classList.remove('on');

  try {
    const { status, data } = await authPost('/api/signup', { username: u, password: p });
    if (status === 200 && data.ok && data.token) {
      S.token = data.token;
      saveToken(data.token);
      saveLastUser(data.user && data.user.username || u);
      unlock();
      await boot();
      toast('账号已创建');
      returnToNext();
      return;
    }
    if (status === 429) return gateErr(data.error || '尝试过于频繁，请稍后再试');
    gateErr(data.error || ('服务异常（' + status + '）'));
  } catch (e) {
    if (!e.handled) gateErr('无法连接服务器：' + e.message);
  } finally {
    btn.disabled = false; btn.innerHTML = '<span class="lbl">创建账号</span>';
  }
}

async function submitCode() {
  const v = $('code').value.trim();
  if (v.length < 6) return gateErr('请输入 6 位动态码');
  const btn = $('codeBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  gateErrEl.classList.remove('on');

  try {
    const { status, data } = await authPost('/api/auth/2fa', { challenge, code: v });
    if (status === 200 && data.ok && data.token) {
      S.token = data.token;
      saveToken(data.token);
      unlock();
      await boot();
      returnToNext();   // 从分享页来的就跳回去，没有 next 时是空操作
      return;
    }
    if (status === 429) return gateErr(data.error || '尝试过于频繁，请稍后再试');
    if (status === 401) return gateErr(data.error || '动态码不正确');
    gateErr(data.error || ('服务异常（' + status + '）'));
  } catch (e) {
    if (!e.handled) gateErr('无法连接服务器：' + e.message);
  } finally {
    btn.disabled = false; btn.innerHTML = '<span class="lbl">进入</span>';
    $('code').select();
  }
}

function saveToken(t) {
  try { sessionStorage.setItem('sunlight.token', t); } catch (_) {}
}

/* ================================================================
   登录后回跳
   ----------------------------------------------------------------
   分享页上的「登录后转存」会带一个 ?next=<本页地址>。
   登录成功后跳回去，人就回到刚才那个分享页继续转存，
   而不是被丢在网盘首页自己找路。
   ================================================================ */

/** 只接受站内相对路径 —— 否则就是一个开放重定向。
    要挡的几种写法：
      https://evil.com    绝对地址
      //evil.com          协议相对（浏览器会当成跨站）
      /\evil.com          反斜杠，部分浏览器归一化成 //
    另外把控制字符和换行去掉，免得被塞进响应头或 URL 里搞出别的花样。 */
function safeNext(raw) {
  if (!raw) return '';
  let s = String(raw).replace(/[\u0000-\u001f\u007f]/g, '');
  if (s[0] !== '/') return '';
  if (s[1] === '/' || s[1] === '\\') return '';
  return s;
}

/** 登录/注册成功之后调一次；没有 next 时不做任何事 */
function returnToNext() {
  let n = '';
  try { n = safeNext(new URLSearchParams(location.search).get('next')); } catch (_) {}
  if (n) location.replace(n);
}

$('pwdBtn').addEventListener('click', submitPwd);
$('user').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('pwd').focus(); } });
$('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitPwd(); } });

$('suBtn').addEventListener('click', submitSignup);
$('suUser').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('suPwd').focus(); } });
$('suPwd').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('suPwd2').focus(); } });
$('suPwd2').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitSignup(); } });

/* 能不能直接进，不用重新登录。
   两条来源，都要试：
     ① sessionStorage 里那张票 —— 同一个标签页里的常规刷新、跳转走这条
     ② **HttpOnly cookie** —— 登录可能是在别处完成的（比如在分享页点了
        「登录后转存」，票是种成 cookie 的），主站的 sessionStorage 是空的。
        这时直接问一次 /api/session：浏览器会自动带上 cookie，能把票换回来。
   早先没有第 ② 条，表现为"在分享页登录过了，回主站还得再登一次"。 */
async function tryRestore() {
  let t = '';
  try { t = sessionStorage.getItem('sunlight.token') || ''; } catch (_) {}
  if (t) S.token = t;

  /* 用裸 fetch，不走 api()。原因：api() 遇到 401 会弹"登录状态已过期"，
     而这里 401 是**正常结果**（新访客就是没登录），弹门会误导人。
     cookie 是 HttpOnly 的，JS 看不见，只能靠发一个请求让服务端告诉我们。 */
  let r = null;
  try {
    r = await fetch('/api/session', {
      headers: t ? { Authorization: 'Bearer ' + t, Accept: 'application/json' }
                 : { Accept: 'application/json' },
      cache: 'no-store'
    });
  } catch (_) { return false; }

  if (!r.ok) {
    /* 没登录：把可能已经过期的本地票清掉 */
    if (t) { S.token = ''; try { sessionStorage.removeItem('sunlight.token'); } catch (_) {} }
    return false;
  }

  try {
    const data = await r.json();
    /* 服务端把票回传了：存下来，后续请求继续走 Authorization 头 */
    if (data && data.token) { S.token = data.token; saveToken(data.token); }
  } catch (_) {}

  unlock();
  await boot();
  /* 恢复会话时也要把"上次没传完"找回来 —— 刷新页面通常走的是这条路
     （会话还在，不用重新登录），记录必须在这里读，光靠 init() 不够。 */
  S.pending = loadPending();
  renderRecovery();
  return true;
}

/* ================================================================
   账号：个人中心 / 修改密码 / 两步验证 / 退出登录
   ----------------------------------------------------------------
   入口是顶栏那个头像。点头像弹菜单，二级动作都在菜单里 ——
   原来退出登录是顶栏上一个常驻图标，现在收进菜单了：
   一个天天被看到、一年用两回的按钮，不值一格的宽度。
   ================================================================ */

/**
 * 头像里画什么：有图就用图，没图就用昵称（或用户名）的头一个字。
 * 用首字母兜底比默认灰头像好认，也不用准备一张占位图。
 */
function avatarInner(a) {
  if (a && a.avatar) return `<img src="${esc(a.avatar)}" alt="">`;
  const src = ((a && (a.nickname || a.username)) || S.meta.brand || 'Sunlight云盘').trim();
  return esc(src.charAt(0).toUpperCase());
}

/**
 * 账号信息变了之后，把跟着它变的几处一次刷完。
 * 传进来的是「增量」，合并进 S.account —— 改资料接口只回账号本身，
 * 不带会话数那些，整体覆盖会把它们抹掉。
 */
function applyAccount(patch) {
  S.account = Object.assign(S.account || {}, patch || {});
  const el = $('avaTop');
  if (el) el.innerHTML = avatarInner(S.account);
  /* 标签页标题优先用昵称 —— 同时开好几个标签时，靠它才分得清哪个是自己的 */
  const brand = brandSpaced(S.meta.brand || 'Sunlight云盘');
  document.title = S.account.nickname ? `${S.account.nickname} · ${brand}` : brand;
}

async function loadAccount() {
  try {
    const d = await api('/api/account');
    applyAccount({ ...d.account, sessions: d.sessions, twoFactor: d.twoFactor });
  } catch (e) {
    /* 拉不到就退回品牌名，不值得为它把整个界面卡住 */
    if (!e.handled) applyAccount({ nickname: '', avatar: '' });
  }
}

/* ---- 存储配置（平台配置 / 我的存储共用） ----
   两段式：先验证身份（step-up），再进表单。拆开是因为保存时
   令牌可能过期（服务端回"请先完成身份验证"），要能原路再验一次。 */

/** 身份验证。验证通过后接哪个表单，由 after 指定 */
function openStepupSheet(title, after) {
  const use2fa = !!(S.account && S.account.totpEnabled);
  openSheet(`
    <h3>${esc(title)}</h3>
    <p class="hint">该页面用于修改文件存储，操作前需验证身份。</p>
    <div class="field">
      <label for="ssIn">${use2fa ? '动态码' : '登录密码'}</label>
      <input class="input" id="ssIn" type="${use2fa ? 'text' : 'password'}"
        ${use2fa ? 'inputmode="numeric" autocomplete="one-time-code" maxlength="8"' : 'autocomplete="current-password"'}>
    </div>
    <div class="sheet-act">
      <button class="btn-ghost" data-x="cancel">取消</button>
      <button class="btn" id="ssOk"><span class="lbl">验证</span></button>
    </div>
  `);

  const submit = async () => {
    const val = $('ssIn').value.trim();
    if (!val) return toast(use2fa ? '请输入动态码' : '请输入密码', true);
    const btn = $('ssOk');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try {
      await api('/api/account/stepup', {
        method: 'POST',
        body: JSON.stringify(use2fa ? { code: val } : { password: val })
      });
      await after();
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false; btn.innerHTML = '<span class="lbl">验证</span>';
    }
  };
  $('ssOk').addEventListener('click', submit);
  $('ssIn').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  $('ssIn').focus();
}

    }
  });

  /* 清除用"再点一次确认"防手滑 —— 误清一次，靠这套配置下载的文件全部断链。 */
  const clearBtn = $('ocClear');
  if (clearBtn) {
    let armed = false;
    clearBtn.addEventListener('click', async () => {
      if (!armed) {
        armed = true;
        clearBtn.textContent = '再点一次确认清除';
        setTimeout(() => { armed = false; if ($('ocClear')) clearBtn.textContent = '清除'; }, 4000);
        return;
      }
      try {
        await ctx.clear();
        toast(ctx.clearToast || '已清除');
        await ctx.reopen();
      } catch (e) {
        if (expired(e)) return;
        toast(e.message, true);
      }
    });
  }
}

   面板在窄屏上会撑得比较满，所以用 .sheet.wide；用户多了就滚动。
   所有破坏性操作都走"先弹确认再发请求"，宁可多点一下。 */

const roleText = r => r === 'owner' ? '站长' : r === 'admin' ? '管理员' : '成员';

/** 把 ISO 时间显示成「3 天前」这种更好读的形式 */
function agoText(iso) {
  if (!iso) return '从未登录';
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return '—';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return '刚刚';
  if (s < 3600) return `${Math.floor(s / 60)} 分钟前`;
  if (s < 86400) return `${Math.floor(s / 3600)} 小时前`;
  if (s < 86400 * 30) return `${Math.floor(s / 86400)} 天前`;
  return new Date(t).toLocaleDateString('zh-CN');
}

async function openUsers() {
  openWideSheet('<h3>用户管理</h3><p class="hint">加载中…</p>');
  let d;
  try {
    d = await api('/api/admin/users');
  } catch (e) {
    return openWideSheet(`<h3>用户管理</h3><p class="hint">加载失败：${esc(e.message)}</p>
      <div class="sheet-act"><button class="btn-ghost" data-x="close">关闭</button></div>`);
  }

  const defLine = d.defaultQuotaBytes
    ? `默认配额 ${fmtSize(d.defaultQuotaBytes)}/人，可按用户覆盖。`
    : '未设置默认配额（不限），可按用户单独设置。';
  /* 没单独设过配额的用户，输入框里是空的 —— 那是"跟随默认"，不是"不限"。
     早先 placeholder 写死「不限」，于是顶部说"默认 1.00 GB/人"、
     每一行却显示「不限」，看着像默认没生效。其实服务端一直按默认在执行。
     现在 placeholder 直接写出默认值，右侧再标一句来源。 */
  const defGB = d.defaultQuotaBytes ? (d.defaultQuotaBytes / 1073741824).toFixed(0) : '';
  const nOff = d.users.filter(u => u.disabled).length;

  openWideSheet(`
    <h3>用户管理</h3>
    <p class="hint">${defLine} 绑定了自己存储的用户不受配额限制，文件也不占你的空间。
      共 ${d.users.length} 个账号${nOff ? `，其中 <b>${nOff} 个已停用</b>` : ''}。</p>
    <div class="utable">
      ${d.users.map(u => {
        const isMe = u.id === d.me;
        const onlyOwner = u.role === 'owner' && d.activeOwners.length <= 1;
        const canDisable = !isMe && !(u.role === 'owner' && onlyOwner);
        return `
        <div class="urow${u.disabled ? ' is-off' : ''}">
          <div class="uid">
            <span class="nick">${esc(u.nickname)}</span>
            ${u.role !== 'member' ? `<span class="badge role">${roleText(u.role)}</span>` : ''}
            ${u.disabled ? '<span class="badge off">已停用</span>' : ''}
            <span class="sub">@${esc(u.username)}${isMe ? '（你自己）' : ''}${u.storageBound ? ' · 已绑定自己的存储' : ''} · ${u.totpEnabled ? '已开两步验证' : '未开两步验证'}</span>
            <span class="ustat">
              <span><i class="k">文件</i>${u.usage.files} · ${u.usage.folders} 个目录</span>
              <span><i class="k">占用</i>${fmtSize(u.usage.bytes)}</span>
              <span><i class="k">登录</i>${u.sessions} 处${u.sessions ? '（可下线）' : ''}${u.shareCount ? ` · <b>${u.shareCount} 条分享在外</b>` : ''}</span>
              <span title="${esc(u.lastLoginAt || '')}"><i class="k">上次</i>${agoText(u.lastLoginAt)}</span>
            </span>
          </div>
          <div class="uacts">
            ${u.sessions > 0 ? `<button class="btn-ghost" data-kick="${esc(u.id)}">下线</button>` : ''}
            ${u.disabled
              ? `<button class="btn-ghost" data-en="${esc(u.id)}">恢复</button>`
              : (canDisable ? `<button class="btn-ghost danger" data-dis="${esc(u.id)}">停用</button>` : '')}
            ${(u.sessions === 0 && !u.disabled && !canDisable) ? '<span class="none">—</span>' : ''}
          </div>
          <div class="uquota">${u.role === 'owner' ? '<i class="uq-fixed">不受限</i>'
            : `<input class="input" id="uq_${esc(u.id)}" inputmode="decimal"
                 placeholder="${defGB || '不限'}"
                 value="${u.quotaBytes != null ? (u.quotaBytes / 1073741824).toFixed(0) : ''}">
              <span class="unit">GB</span>
              <button class="btn-ghost" data-uq="${esc(u.id)}">保存</button>
              <i class="uq-why">${u.quotaBytes != null ? '单独' : (defGB ? '默认' : '不限')}</i>`}</div>        </div>`;
      }).join('')}
    </div>
    <div class="sheet-act spread">
      <button class="btn-ghost" id="ureload">刷新</button>
      <button class="btn-ghost" data-x="close">关闭</button>
    </div>
  `);

  $('ureload').addEventListener('click', () => openUsers());

  /* 配额 */
  sheet.querySelectorAll('[data-uq]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.uq;
    const v = $('uq_' + id).value.trim();
    b.disabled = true;
    try {
      const r = await api('/api/admin/users/quota', {
        method: 'POST',
        body: JSON.stringify({ userId: id, quotaGB: v === '' ? 0 : Number(v) })
      });
      const q = r.user && r.user.quotaBytes;
      /* 清空输入框 = 取消单独设置，回到全站默认 —— 不是"不限"。
         默认本身为 0 时才是真的不限，那时提示也跟着说"不限"。 */
      toast(q == null
        ? (d.defaultQuotaBytes ? '已恢复为默认配额' : '配额已设为不限')
        : `配额已设为 ${(q / 1073741824).toFixed(1)} GB`);
    } catch (e) {
      toast(e.message, true);
    }
    b.disabled = false;
  }));

  /* 停用 / 恢复 / 强制下线：每个都先确认 */
  const findUser = id => d.users.find(u => u.id === id) || {};

  sheet.querySelectorAll('[data-dis]').forEach(b => b.addEventListener('click', async () => {
    const u = findUser(b.dataset.dis);
    /* 分享是独立记录：停用只拦登录，不会自动收回他已经发出去的链接。
       因滥用而停用时这两件事通常要一起做，所以问一句、默认勾上。 */
    const nShares = u.shareCount || 0;
    const wantRevoke = nShares > 0
      ? confirm(`停用「${u.nickname}」（@${u.username}）？\n\n`
        + `· 他立刻无法登录，已经登录的会话下次请求就失效\n`
        + `· 他的文件会保留，随时可以恢复账号\n\n`
        + `他还有 ${nShares} 条分享链接在外面。\n`
        + `【确定】= 连这些分享一起撤销（别人就打不开了）\n`
        + `【取消】= 什么都不做`)
      : confirm(`停用「${u.nickname}」（@${u.username}）？\n\n`
        + `· 他立刻无法登录，已经登录的会话下次请求就失效\n`
        + `· 他的文件、分享都保留着，随时可以恢复\n`);
    b.disabled = true;
    try {
      const r = await api('/api/admin/users/disable', {
        method: 'POST',
        body: JSON.stringify({ userId: b.dataset.dis, revokeShares: wantRevoke })
      });
      toast(`已停用 ${u.nickname}`
        + (r.sessionsDropped ? `，踢掉 ${r.sessionsDropped} 个会话` : '')
        + (r.sharesRevoked ? `，撤销 ${r.sharesRevoked} 条分享` : ''));
      openUsers();
    } catch (e) { toast(e.message, true); b.disabled = false; }
  }));

  sheet.querySelectorAll('[data-en]').forEach(b => b.addEventListener('click', async () => {
    const u = findUser(b.dataset.en);
    if (!confirm(`恢复「${u.nickname}」（@${u.username}）的登录权限？`)) return;
    b.disabled = true;
    try {
      await api('/api/admin/users/enable', { method: 'POST', body: JSON.stringify({ userId: b.dataset.en }) });
      toast(`已恢复 ${u.nickname}`);
      openUsers();
    } catch (e) { toast(e.message, true); b.disabled = false; }
  }));

  sheet.querySelectorAll('[data-kick]').forEach(b => b.addEventListener('click', async () => {
    const u = findUser(b.dataset.kick);
    const self = u.id === d.me;
    /* 按钮上的数字挪走后，具体几个会话在这里说清楚 */
    if (!confirm(`把「${u.nickname}」的 ${u.sessions} 处登录全部作废？\n\n`
      + (self ? '注意：这是你自己的账号，操作后你也会被登出。\n' : '他的账号仍然有效，可以自己重新登录。\n'))) return;
    b.disabled = true;
    try {
      const r = await api('/api/admin/users/logout-all', { method: 'POST', body: JSON.stringify({ userId: b.dataset.kick }) });
      toast(`已作废 ${r.sessionsDropped} 个会话`);
      if (self) return location.reload();
      openUsers();
    } catch (e) { toast(e.message, true); b.disabled = false; }
  }));
}

/**
 * 把用户选的图缩到 200px 再转成 data URI。
 *
 * 为什么在浏览器里缩，而不是原样传上去：
 *   手机随手拍的照片 3-8MB，传上去要么被服务端拒掉（那边 400KB 上限），
 *   要么把 drive.json 撑成几十兆 —— 而那个文件每次改昵称都要整个重写。
 *   顶栏头像只显示 32px，200px 足够三倍屏用了。
 */
async function shrinkImage(file, max = 200) {
  if (!/^image\//.test(file.type || '')) throw new Error('请选一张图片');
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * scale));
  const h = Math.max(1, Math.round(bmp.height * scale));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  return cv.toDataURL('image/png');
}

/** 只取日期部分。注册时间精确到秒没有意义，还占地方 */

function openAccount() {
  const a = S.account || {};

  openSheet(`
    <h3>个人中心</h3>
    <div class="prof">
      <div class="ava lg" id="acAva">${avatarInner(a)}</div>
      <div class="prof-side">

    <div class="sheet-act">
      <button class="btn-ghost" data-x="close">关闭</button>
    </div>
  `);

  /* 选文件的 input 每次现建现点、用完即弃。复用一个全局 input 反而要处理
     "两次选同一个文件不触发 change"这类怪事。 */
  $('acPick').addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/png,image/jpeg,image/webp';

    inp.addEventListener('change', async () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const btn = $('acPick');
      btn.disabled = true; btn.textContent = '处理中…';
      try {
        const data = await shrinkImage(f);
        const d = await api('/api/account/avatar', {
          method: 'POST', body: JSON.stringify({ avatar: data })
        });
        applyAccount(d.account);
        $('acAva').innerHTML = avatarInner(d.account);
        $('acClear').disabled = false;
        toast('头像已更新');
      } catch (e) {
        toast(e.message, true);
      } finally {
        const b = $('acPick');
        if (b) { b.disabled = false; b.textContent = '换一张'; }
      }
    });

    inp.click();
  });

  $('acClear').addEventListener('click', async () => {
    const btn = $('acClear');
    btn.disabled = true;
    try {
      const d = await api('/api/account/avatar/clear', { method: 'POST', body: '{}' });
      applyAccount(d.account);
      $('acAva').innerHTML = avatarInner(d.account);
      toast('已恢复默认头像');
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false;
    }
  });

  /* 昵称：默认只显示，点「修改」才变输入框。
     一进门就摆个空输入框，看着像必填项，其实一年也改不了几回。 */
  let nick = a.nickname || '';

  const nickEdit = () => {
    $('acNickBox').innerHTML = `<input class="input" id="acNick" value="${esc(nick)}"
        placeholder="${esc(a.username || '')}" maxlength="24" spellcheck="false">
      <button class="linkish" id="acNickSave">保存</button>
      <button class="linkish" id="acNickCancel">取消</button>`;
    const input = $('acNick');
    input.focus();
    input.select();
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); $('acNickSave').click(); }
    });
    $('acNickCancel').addEventListener('click', nickView);
    $('acNickSave').addEventListener('click', async () => {
      const next = input.value.trim();
      if (next === nick.trim()) return nickView();
      const btn = $('acNickSave');
      btn.disabled = true; btn.textContent = '保存中';
      try {
        const d = await api('/api/account/profile', {
          method: 'POST', body: JSON.stringify({ nickname: next })
        });
        applyAccount(d.account);
        nick = (d.account && d.account.nickname) || '';
        nickView();
        toast('已保存');
      } catch (e) {
        toast(e.message, true);
        btn.disabled = false; btn.textContent = '保存';
      }
    });
  };

  const nickView = () => {
    $('acNickBox').innerHTML = `<span class="nick-t">${esc(nick || a.username || '')}</span>
      <button class="linkish" id="acNickEdit">修改</button>`;
    $('acNickEdit').addEventListener('click', nickEdit);
  };
  nickView();
}
