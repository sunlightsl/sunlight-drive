}

/* 排序：文件夹永远在前，其余按选中的规则 */
/* 各字段的默认方向：名称从小到大，大小和时间从大到小 —— 跟大多数人的直觉一致。
   再次点击同一个字段就反过来，S.sortDir 留空表示"用默认"。 */
const SORT_DEFAULT_DIR = { name: 'asc', date: 'desc', size: 'desc', type: 'asc' };
const sortDirOf = () => S.sortDir || SORT_DEFAULT_DIR[S.sort] || 'asc';

function sorted(list) {
  const arr = [...list];
  const cmp = {
    name: (a, b) => String(a.name).localeCompare(String(b.name), 'zh', { numeric: true }),
    date: (a, b) => String(a.updatedAt || a.createdAt || '').localeCompare(String(b.updatedAt || b.createdAt || '')),
    size: (a, b) => (a.size || 0) - (b.size || 0),
    type: (a, b) => {
      const ea = (a.name.match(/\.([^.]+)$/) || [, ''])[1].toLowerCase();
      const eb = (b.name.match(/\.([^.]+)$/) || [, ''])[1].toLowerCase();
      return ea.localeCompare(eb) || String(a.name).localeCompare(String(b.name), 'zh', { numeric: true });
    }
  }[S.sort] || (() => 0);

  // 比较器一律写成"从小到大"，方向在这里统一翻转
  const dir = sortDirOf() === 'desc' ? -1 : 1;
  return arr.sort((a, b) => {
    if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
    return cmp(a, b) * dir;
  });
}

/* 排序箭头。箭头本身朝下，升序就转 180° 朝上 ——
   亮着的字段会跟着当前方向转，一眼能看出现在是从小到大还是从大到小。 */
const sortCaret = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
    stroke-linecap="round" stroke-linejoin="round"
    style="${S.sort === k && sortDirOf() === 'asc' ? 'transform:rotate(180deg)' : ''}"><path d="M6 9l6 6 6-6"/></svg>`;

/* 网格视图没有列头，排序入口就摆在网格上方那一条。 */
const gridSortBar = () => `<div class="gsort">
    <span class="gsort-t">排序</span>
    <span class="sortable ${S.sort === 'name' ? 'on' : ''}" data-sort="name">名称${sortCaret('name')}</span>
    <span class="sortable ${S.sort === 'size' ? 'on' : ''}" data-sort="size">大小${sortCaret('size')}</span>
    <span class="sortable ${S.sort === 'date' ? 'on' : ''}" data-sort="date">修改时间${sortCaret('date')}</span>
  </div>`;

function checkbox(id) {
  const on = S.sel.has(id);
  return `<span class="cb${on ? ' on' : ''}" data-cb="${esc(id)}" role="checkbox" aria-checked="${on}">${I.check}</span>`;
}

function renderPanel() {
  const panel = $('panel');

  /* ---- 搜索态：扁平结果列表 ---- */
  if (S.hits) {
    if (!S.hits.length) {
      panel.innerHTML = `<div class="empty"><div class="eico">${I.file}</div>没有匹配「${esc(S.q.trim())}」的内容</div>`;
      return;
    }
    const rows = S.hits.map(n => {
      const ic = iconOf(n);
      return `<div class="row${n.type === 'folder' ? ' dir' : ''}${S.sel.has(n.id) ? ' sel' : ''}"
        data-id="${esc(n.id)}" draggable="true">
        ${checkbox(n.id)}
        <span class="fname">
          <span class="fico ${ic.cls}" style="margin-right:1px">${ic.svg}</span>
          <span class="t">${esc(n.name)}</span>
          <span class="path">${esc(pathOf(n.parent))}</span>
        </span>
        <span class="fsize">${n.type === 'folder' ? '—' : fmtSize(n.size)}</span>
        <span class="fdate">${n.type === 'folder' ? '' : fmtDate(n.updatedAt)}</span>
        <span class="fact">${moreBtn(n)}</span>
      </div>`;
    }).join('');
    panel.innerHTML = `<div class="rows" id="rows">${rows}</div>`;
    return;
  }

  /* ---- 空目录 ---- */
  if (!S.children.length) {
    panel.innerHTML = `<div class="empty">
      <div class="eico">${I.cloud}</div>
      这里还是空的
      <div class="acts">
        <button class="btn" data-act="upload">${I.up}上传文件</button>
        <button class="btn-ghost" data-act="uploadDir">${I.folder}上传文件夹</button>
        <button class="btn-ghost" data-act="newfolder">${I.folder}新建文件夹</button>
      </div>
    </div>`;
    return;
  }

  const list = sorted(S.children);

  /* ---- 网格 ---- */
  if (S.view === 'grid') {
    panel.innerHTML = gridSortBar() + '<div class="grid" id="rows">' + list.map(n => {
      const ic = iconOf(n);
      return `<div class="card-t${n.type === 'folder' ? ' dir' : ''}${S.sel.has(n.id) ? ' sel' : ''}"
        data-id="${esc(n.id)}" draggable="true">
        ${checkbox(n.id)}
        <span class="cico${ic.cls ? '' : ' file'}">${ic.svg}</span>
        <span class="cname">${esc(n.name)}</span>
        <span class="cmeta">
          <span class="csize">${n.type === 'folder' ? '文件夹' : fmtSize(n.size)}</span>
          ${moreBtn(n)}
        </span>
      </div>`;
    }).join('') + '</div>';
    return;
  }

  /* ---- 列表 ---- */
  // 表头即可排序，工具栏上不再另挂一个排序下拉框。
  const head = `<div class="lhead">
      <span>${checkbox('__all')}</span>
      <span class="sortable ${S.sort === 'name' ? 'on' : ''}" data-sort="name">名称${sortCaret('name')}</span>
      <span class="sortable r ${S.sort === 'size' ? 'on' : ''}" data-sort="size">大小${sortCaret('size')}</span>
      <span class="sortable r h-date ${S.sort === 'date' ? 'on' : ''}" data-sort="date">修改时间${sortCaret('date')}</span>
      <span></span>
    </div>`;

  const rows = list.map(n => {
    const ic = iconOf(n);
    return `<div class="row${n.type === 'folder' ? ' dir' : ''}${S.sel.has(n.id) ? ' sel' : ''}"
      data-id="${esc(n.id)}" draggable="true"
      title="${esc(n.name)}${n.type === 'file' ? ' · ' + fmtSize(n.size) : ''}">
      ${checkbox(n.id)}
      <span class="fname"><span class="fico ${ic.cls}" style="margin-right:1px">${ic.svg}</span><span class="t">${esc(n.name)}</span></span>
      <span class="fsize">${n.type === 'folder' ? '—' : fmtSize(n.size)}</span>
      <span class="fdate">${n.type === 'folder' ? fmtDate(n.createdAt) : fmtDate(n.updatedAt)}</span>
      <span class="fact">${moreBtn(n)}</span>
    </div>`;
  }).join('');

  panel.innerHTML = head + `<div class="rows" id="rows">${rows}</div>`;
}

const moreBtn = n => `<button class="ract" data-menu="${esc(n.id)}" title="更多操作">${I.more}</button>`;

function renderSelBar() {
  const bar = $('selbar');
  if (!S.sel.size) { bar.classList.remove('on'); return; }
  bar.classList.add('on');
  const nodes = S.selNodes();
  const bytes = nodes.reduce((s, n) => s + (n.size || 0), 0);
  const dirs = nodes.filter(n => n.type === 'folder').length;
  const files = nodes.length - dirs;
  const bits = [];
  if (dirs) bits.push(dirs + ' 个文件夹');
  if (files) bits.push(files + ' 个文件');
  $('selCount').textContent = `已选 ${S.sel.size} 项` + (bytes ? ` · ${fmtSize(bytes)}` : '') + (bits.length === 2 ? '（' + bits.join(' / ') + '）' : '');

  // 文件夹不能直接下载，混选时禁用下载，免得点了没反应
  $('selDl').disabled = S.sel.size !== 1 || nodes[0].type !== 'file';
  $('selDl').style.opacity = $('selDl').disabled ? .45 : 1;
  $('selDl').style.cursor = $('selDl').disabled ? 'default' : 'pointer';
}

function syncViewBtn() {
  const b = $('btnView');
  b.innerHTML = S.view === 'list' ? I.grid : I.list;
  b.title = S.view === 'list' ? '切换到网格视图' : '切换到列表视图';
}

/* 返回上一级。根目录没有上一级，禁用占位 —— 灰着比消失好，布局不跳 */
function syncBackBtn() {
  const b = $('btnBack');
  b.disabled = !S.parent;
  b.title = S.parent ? '返回上一级' : '已经在最外层了';
}

/* 当前选中节点（从 children 或 flat 里取，搜索态下 children 可能不含它） */
S.selNodes = function () {
  const pool = new Map();
  S.children.forEach(n => pool.set(n.id, n));
  S.flat.forEach(n => { if (!pool.has(n.id)) pool.set(n.id, n); });
  if (S.hits) S.hits.forEach(n => { if (!pool.has(n.id)) pool.set(n.id, n); });
  return [...S.sel].map(id => pool.get(id)).filter(Boolean);
};
const selNodes = () => S.selNodes();

/* ================================================================
   选择
   ================================================================ */
function currentList() { return S.hits || sorted(S.children); }

/**
 * 只同步选中样式，不重建列表。
 *
 * 为什么不能顺手调 renderPanel()：单击行要更新选中态，而整个列表的 DOM
 * 一旦被换掉，浏览器判定「这两次点击落在同一个元素上」的依据就没了，
 * dblclick 事件再也不会触发 —— 表现出来就是「双击文件夹进不去」。
 * 只改 class 就没这个问题。
 *
 * 顺带补一个一直存在的小毛病：表头的全选勾选框是 checkbox('__all') 渲染的，
 * 它的选中态取 S.sel.has('__all')，永远为 false，所以全选之后表头那个勾
 * 一直不亮。这里按实际数量补上。
 */
function syncSel() {
  document.querySelectorAll('#panel [data-id]').forEach(el => {
    const on = S.sel.has(el.dataset.id);
    el.classList.toggle('sel', on);
    const cb = el.querySelector('.cb');
    if (cb) {
      cb.classList.toggle('on', on);
      cb.setAttribute('aria-checked', String(on));
    }
  });

  const total = currentList().length;
  const allOn = total > 0 && S.sel.size === total;
  document.querySelectorAll('#panel [data-cb="__all"]').forEach(el => {
    el.classList.toggle('on', allOn);
    el.setAttribute('aria-checked', String(allOn));
  });

  renderSelBar();
}

function toggleSel(id, mode) {
  // mode: 'replace' | 'toggle'
  if (mode === 'toggle') {
    S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id);
  } else {
    S.sel.clear();
    S.sel.add(id);
  }
  S.lastClick = id;
  syncSel();
}

function rangeSel(id) {
  const list = currentList().map(n => n.id);
  const a = list.indexOf(S.lastClick);
  const b = list.indexOf(id);
  if (a < 0 || b < 0) return toggleSel(id, 'replace');
  S.sel.clear();
  for (let i = Math.min(a, b); i <= Math.max(a, b); i++) S.sel.add(list[i]);
  syncSel();
}

function selectAll(on) {
  if (on) currentList().forEach(n => S.sel.add(n.id));
  else S.sel.clear();
  syncSel();
}

/* ================================================================
   弹层
   ================================================================ */
const modal = $('modal'), sheet = $('sheet');
let sheetOnClose = null;

function openSheet(html, onClose) {
  sheet.classList.remove('wide');
  sheet.innerHTML = html;
  sheetOnClose = onClose || null;
  modal.classList.add('on');
}

/** 宽面板（用户管理那种）。单独一个入口，免得每张弹窗都要记得自己加类 */
function openWideSheet(html, onClose) {
  openSheet(html, onClose);
  sheet.classList.add('wide');
}
function closeSheet() {
  modal.classList.remove('on');
  sheet.innerHTML = '';
  /* wide 是给用户管理那种宽面板用的，关掉时必须摘掉，
     否则下一张普通弹窗会跟着变宽 */
  sheet.classList.remove('wide');
  const f = sheetOnClose; sheetOnClose = null;
  if (f) f();
}
modal.addEventListener('click', e => { if (e.target === modal) closeSheet(); });

/* 弹层里的「取消 / 关闭」在这统一兜底接一遍。
   以前是每张弹层自己接，谁漏了谁就点了没反应 —— 改密码和两步验证那几张
   就是这么漏掉的。各弹层自己接的那份留着也不冲突：closeSheet 幂等，
   onClose 因为 sheetOnClose 只取一次，也只会触发一次。 */
sheet.addEventListener('click', e => {
  if (e.target.closest('[data-x="cancel"],[data-x="close"],[data-x="done"]')) closeSheet();
});

/* 简易确认/输入弹窗 */
function promptSheet({ title, hint, label, value, placeholder, okText, danger, warn, type, onOk }) {
  openSheet(`
    <h3>${esc(title)}</h3>
    ${hint ? `<p class="hint">${hint}</p>` : ''}
    ${warn || ''}
    <div class="field">
      <label for="pf">${esc(label)}</label>
      <input class="input" id="pf" type="${type === 'password' ? 'password' : 'text'}"
             value="${esc(value || '')}" placeholder="${esc(placeholder || '')}" spellcheck="false">
    </div>
    <div class="sheet-act">
      <button class="btn-ghost" data-x="cancel">取消</button>
      <button class="btn${danger ? ' btn-danger' : ''}" data-x="ok">${esc(okText || '确定')}</button>
    </div>`);

  const input = $('pf');
  const isPwd = type === 'password';
  setTimeout(() => {
    input.focus();
    // 改名时选中主干、留下扩展名，省得手改时误删 ".zip"。
    // 密码框不做这个，也没有全选——全选会把密码亮出来。
    if (isPwd) return;
    const dot = input.value.lastIndexOf('.');
    if (dot > 0) input.setSelectionRange(0, dot); else input.select();
  }, 60);

  const submit = async () => {
    const v = input.value.trim();
    if (!v) return input.focus();
    const btn = sheet.querySelector('[data-x="ok"]');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try {
      await onOk(v);
      closeSheet();
    } catch (e) {
      btn.disabled = false; btn.textContent = okText || '确定';
      toast(e.message, true);
      input.select();
    }
  };

  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  sheet.querySelector('[data-x="cancel"]').addEventListener('click', closeSheet);
  sheet.querySelector('[data-x="ok"]').addEventListener('click', submit);
}

/* ================================================================
   操作：新建文件夹 / 改名
   ================================================================ */
function newFolder() {
  promptSheet({
    title: '新建文件夹',
    hint: `建在 <b>${esc(currentDirName())}</b> 下`,
    label: '文件夹名称',
    placeholder: '例如 2026 升级包',
    okText: '创建',
    onOk: async (name) => {
      await api('/api/folder', { method: 'POST', body: JSON.stringify({ name, parent: S.parent }) });
      await refresh();
      toast('已创建「' + name + '」');
    }
  });
}

function renameNode(id) {
  const n = (S.children.concat(S.flat)).find(x => x.id === id);
  if (!n) return;
  promptSheet({
    title: '重命名',
    label: '新名称',
    value: n.name,
    okText: '保存',
    onOk: async (name) => {
      const r = await api('/api/rename', { method: 'POST', body: JSON.stringify({ id, name }) });
      await refresh();
      if (r.node && r.node.name !== name) toast('已存在同名文件，已重命名为「' + r.node.name + '」');
    }
  });
}

/* ================================================================
   操作：删除
   ================================================================ */
async function deleteNodes(ids) {
  const pool = new Map();
  S.children.concat(S.flat).forEach(n => pool.set(n.id, n));
  const nodes = ids.map(i => pool.get(i)).filter(Boolean);
  if (!nodes.length) return;

  /* 摊平一次父子关系，用来算「删掉这个文件夹到底带走多少东西」。
     删之前把数字摆给用户看，比事后说一句「已删除」有用得多。 */
  const kids = new Map();
  S.flat.forEach(n => {
    const p = n.parent || '__root';
    if (!kids.has(p)) kids.set(p, []);
    kids.get(p).push(n);
  });

  const seen = new Set();
  const stack = [];
  let allFiles = 0, allDirs = 0, allBytes = 0;

  for (const n of nodes) {
    if (seen.has(n.id)) continue;          // 父子同时被选中时不重复数
    seen.add(n.id);
    if (n.type === 'file') { allFiles++; allBytes += n.size || 0; }
    else { allDirs++; if (kids.has(n.id)) stack.push(...kids.get(n.id)); }
  }
  while (stack.length) {
    const cur = stack.pop();
    if (seen.has(cur.id)) continue;
    seen.add(cur.id);
    if (cur.type === 'file') { allFiles++; allBytes += cur.size || 0; }
    else { allDirs++; if (kids.has(cur.id)) stack.push(...kids.get(cur.id)); }
  }

  const selfDirs = nodes.filter(n => n.type === 'folder').length;
  const extra = (allFiles + allDirs) - nodes.length;

  openSheet(`
    <h3>删除 ${nodes.length} 项</h3>
    <div class="warn">${I.warn}<div>
      会同时删掉<b>对象存储里的文件</b>，这里没有回收站，删了找不回来。
      ${selfDirs ? '删文件夹会连同里面所有内容一起删。' : ''}
    </div></div>
    <p class="hint">
      ${nodes.slice(0, 6).map(n => '· ' + esc(n.name)).join('<br>')}
      ${nodes.length > 6 ? `<br>· … 另外 ${nodes.length - 6} 项` : ''}
      <br><br>
      ${extra > 0
        ? `连带删除：${allDirs - selfDirs} 个文件夹、${allFiles} 个文件<br>`
        : ''}
      合计 <b>${allFiles} 个文件 / ${allDirs} 个文件夹 · ${fmtSize(allBytes)}</b>
    </p>
    <div class="sheet-act">
      <button class="btn-ghost" data-x="cancel">取消</button>
      <button class="btn btn-danger" data-x="ok">确认删除</button>
    </div>`);

  sheet.querySelector('[data-x="cancel"]').addEventListener('click', closeSheet);
  const ok = sheet.querySelector('[data-x="ok"]');
  ok.addEventListener('click', async () => {
    ok.disabled = true; ok.innerHTML = '<span class="spin"></span>';
    try {
      const r = await api('/api/delete', { method: 'POST', body: JSON.stringify({ ids }) });
      closeSheet();
      await refresh();
      let msg = `已删除 ${r.removed} 项`;
      if (r.failed && r.failed.length) msg += `，${r.failed.length} 个存储对象没删掉（已记日志）`;
      toast(msg);
    } catch (e) {
      ok.disabled = false; ok.textContent = '确认删除';
      if (!e.handled) toast(e.message, true);
    }
  });
}

/* ================================================================
   操作：移动（目录选择器）
   ================================================================ */
function moveNodes(ids) {
  if (!S.flat.length) { loadFlat().then(() => moveNodes(ids)).catch(e => toast(e.message, true)); return; }

  const byId = new Map(S.flat.map(n => [n.id, n]));
  const moving = ids.map(i => byId.get(i)).filter(Boolean);

  /* 不能移进自己或自己的后代 —— 服务端也会拦，但让用户先看见为什么点不动 */
  const banned = new Set();
  for (const m of moving) {
    if (m.type !== 'folder') continue;
    banned.add(m.id);
    const stack = [m.id];
    while (stack.length) {
      const cur = stack.pop();
      S.flat.forEach(n => { if (n.parent === cur && !banned.has(n.id)) { banned.add(n.id); stack.push(n.id); } });
    }
  }

  const folders = S.flat.filter(n => n.type === 'folder').sort((a, b) =>
    pathOf(a.id).localeCompare(pathOf(b.id), 'zh', { numeric: true }));

  let pick = S.parent;
  const renderPicker = () => {
    const rows = [`<div class="pk-row${pick === null ? ' on' : ''}" data-pick="__root">
        ${I.folder}<span class="pk-name">全部文件</span>
        <span class="pk-why">${S.parent === null ? '当前位置' : ''}</span>
      </div>`];
    for (const f of folders) {
      const dis = banned.has(f.id);
      const cur = S.parent === f.id;
      rows.push(`<div class="pk-row${pick === f.id ? ' on' : ''}${dis ? ' dis' : ''}" data-pick="${esc(f.id)}">
        ${I.folder}<span class="pk-name">${esc(pathOf(f.id))}</span>
        <span class="pk-why">${dis ? '不能移到这里' : (cur ? '当前位置' : '')}</span>
      </div>`);
    }
    $('picker').innerHTML = rows.join('');
  };

  openSheet(`
    <h3>移动到</h3>
    <p class="hint">选择目标文件夹，所选 ${ids.length} 项将移动至该位置。</p>
    <div class="picker" id="picker"></div>
    <div class="sheet-act">
      <button class="btn-ghost" data-x="cancel">取消</button>
      <button class="btn" data-x="ok">移动到这里</button>
    </div>`);
  renderPicker();

  $('picker').addEventListener('click', e => {
    const row = e.target.closest('[data-pick]');
    if (!row || row.classList.contains('dis')) return;
    const v = row.dataset.pick;
    pick = v === '__root' ? null : v;
    renderPicker();
  });

  sheet.querySelector('[data-x="cancel"]').addEventListener('click', closeSheet);
  const ok = sheet.querySelector('[data-x="ok"]');
  ok.addEventListener('click', async () => {
    ok.disabled = true; ok.innerHTML = '<span class="spin"></span>';
    try {
      const r = await api('/api/move', { method: 'POST', body: JSON.stringify({ ids, parent: pick }) });
      closeSheet();
      await refresh();
      // 服务端遇到同名会自动加序号，改过就得说一声，不然用户以为没生效
      const renamedList = (r.nodes || []).filter(n => {
        const before = byId.get(n.id);
        return before && before.name !== n.name;
      });
      toast(renamedList.length
        ? `已移动，${renamedList.length} 项因重名自动重命名（如「${renamedList[0].name}」）`
        : `已移动 ${ids.length} 项`);
    } catch (e) {
      ok.disabled = false; ok.textContent = '移动到这里';
      toast(e.message, true);
    }
  });
}

/* ================================================================
   操作：在线预览
   预览与下载是两个独立动作：
     · 双击文件 / 「⋯ → 预览」→ 打开弹层看
     · 双击仍走预览；要拿原文件走「⋯ → 下载」
   左边切换只在**当前这一屏能预览的文件**之间走。
   ================================================================ */
function openPreview(id) {
  const nodes = currentList();
  const node = nodes.find(n => n.id === id);
  if (node && node.type === 'folder') return;
  const ok = window.PV.open(nodes, id, {
    getUrl: (nid) => api('/api/preview?id=' + encodeURIComponent(nid)),
    download: (nid) => downloadNode(nid)
  });
  if (!ok) toast('这个文件不支持在线预览，请用「⋯ → 下载」取原文件', true);
}

/* ================================================================
   操作：下载（任务化，进传输中心）
   下载走 fetch 流式拉取：能报进度、能暂停（AbortController）、
   能从断点续传（Range 请求）。签名 URL 上的 Range 头不参与签名，
   OSS 会直接尊重它。fetch 因 CORS 失败时降级为浏览器托管下载。
   ================================================================ */
async function downloadNode(id) {
  if (S.busy.has(id)) return;
  const node = S.children.concat(S.flat).find(n => n.id === id);
  if (node && node.type === 'folder') return toast('文件夹不支持直接下载，请选择其中的文件', true);

  S.busy.add(id); renderPanel();
  try {
    const r = await api('/api/download?id=' + encodeURIComponent(id));
    const t = {
      tid: 'dl_' + crypto.randomUUID(),
      name: r.fileName || 'file',
      size: node ? node.size : 0,
      loaded: 0,
      status: 'down',
      error: '',
      url: r.url,
      chunks: [],
      controller: new AbortController()
    };
    S.downloads.push(t);
    $('upPanel').classList.add('on');
    renderUploads();
    startDownload(t, false);
  } catch (e) {
    if (!e.handled) toast('下载失败：' + e.message, true);
  } finally {
    S.busy.delete(id); renderPanel();
  }
}

async function startDownload(t, resume) {
  try {
    const headers = resume && t.loaded > 0 ? { Range: 'bytes=' + t.loaded + '-' } : {};
    const res = await fetch(t.url, { headers, signal: t.controller.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    /* 200 = 服务器无视了 Range，从头再来 */
    if (resume && res.status !== 206) { t.chunks = []; t.loaded = 0; }
    if (!t.size) {
      const cl = parseInt(res.headers.get('content-length'), 10);
      if (Number.isFinite(cl) && cl > 0) t.size = cl;
    }
    if (!res.body) throw new Error('no-stream');

    t.status = 'down';
    renderUploads();
    const reader = res.body.getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      t.chunks.push(value);
      t.loaded += value.length;
      renderUploads();
    }

    saveDownloadResult(t);
  } catch (e) {
    if (e.name === 'AbortError') {
      if (t._del) return;              // 删除时主动中止，任务已移除
      if (t._pause) { t.status = 'paused'; renderUploads(); return; }
      return;
    }
    /* CORS 或老浏览器不支持流式：把链接丢给浏览器托管，任务记为完成 */
    if (e instanceof TypeError || /no-stream/.test(e.message)) {
      browserDownload(t.url, t.name);
      t.status = 'done'; t.loaded = t.size || t.loaded;
      t.renamed = '已转交浏览器（不支持暂停）';
      renderUploads();
      return;
    }
    t.status = 'fail';
    t.error = e.message;
    renderUploads();
  }
}

function saveDownloadResult(t) {
  const blob = new Blob(t.chunks);
  t.chunks = [];
  const objUrl = URL.createObjectURL(blob);
  browserDownload(objUrl, t.name, () => URL.revokeObjectURL(objUrl));
  t.status = 'done';
  t.loaded = t.size || t.loaded;
  renderUploads();
}

function browserDownload(url, name, cleanup) {
  const a = document.createElement('a');
  a.href = url;
  a.download = name || '';
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  if (cleanup) setTimeout(cleanup, 60000);
}

function pauseDownload(t) {
  if (t.status !== 'down') return;
  t._pause = true;
  t.controller.abort();
}

function resumeDownload(t) {
  if (t.status !== 'paused') return;
  t._pause = false;
  t.controller = new AbortController();
  startDownload(t, true);
}

function deleteDownload(t) {
  if (t.status === 'down') { t._del = true; t.controller.abort(); }
  t.chunks = [];
  S.downloads = S.downloads.filter(x => x !== t);
  renderUploads();
}

/* ================================================================

function shareNodes(ids) {

    ? `<p class="hint">所选 ${nodes.length} 项将通过<b>同一条链接</b>分享，对方使用一个密码即可访问全部内容。</p>`
    : '';

  openSheet(`
    <h3>创建分享</h3>
    ${hint}
    <div class="field">
      <label>分享内容</label>
      <div style="font-size:13.5px;color:var(--text-dim);line-height:1.7">
        ${nodes.slice(0, 6).map(n => (n.type === 'folder' ? '[文件夹] ' : '[文件] ') + esc(n.name)).join('<br>')}
        ${nodes.length > 6 ? `<br>… 另外 ${nodes.length - 6} 项` : ''}
      </div>
    </div>
    <div class="field">
      <label>有效期</label>
      ${ttlPickerHTML('ttlPick', 'ttlPerm')}
    </div>
    <div class="field">
      <label>访问密码</label>
      <input class="input" id="spw" maxlength="32" autocomplete="off" spellcheck="false" placeholder="4–32 位，留空自动生成">
    </div>
    <div class="field">
      <label>对方可以做什么</label>
      <div class="perm-list">
        ${permRow('pv', '在线预览')}
        ${permRow('dl', '下载原文件')}
        ${permRow('sv', '保存到自己的网盘')}
        ${permRow('wm', '页面水印')}
      </div>
    </div>
    <div class="sheet-act">
      <button class="btn-ghost" data-x="cancel">取消</button>
      <button class="btn" data-x="ok">${I.share}生成链接</button>
    </div>`);

  /* 默认 2 小时 */
  $('ttlPick_h').value = 2;
  $('ttlPerm').addEventListener('click', () => {
    const on = $('ttlPerm').classList.toggle('on');
    $('ttlPick').querySelectorAll('.tp-n').forEach(i => { i.disabled = on; });
  });

  /* 四个权限勾选框，默认全勾。勾上 = 允许。
     监听挂在**整行**上：点方框或点文字都算一次切换。
     只切 class 不动 innerHTML —— 勾掉再勾回来要能复原。 */
  const perm = { pv: true, dl: true, sv: true, wm: true };
  sheet.querySelectorAll('[data-perm-row]').forEach(row => {
    const key = row.dataset.permRow;
    const cb = row.querySelector('.cb');
    row.addEventListener('click', () => {
      perm[key] = !perm[key];
      cb.classList.toggle('on', perm[key]);
      cb.setAttribute('aria-checked', String(perm[key]));
    });
  });

  sheet.querySelector('[data-x="cancel"]').addEventListener('click', closeSheet);
  const ok = sheet.querySelector('[data-x="ok"]');
  ok.addEventListener('click', async () => {
    const ttl = readTtlPicker('ttlPick', 'ttlPerm');
    if (!ttl) return toast('有效期至少 1 分钟', true);
    const pw = $('spw').value.trim();
    if (pw && (pw.length < 4 || /\s/.test(pw))) return toast('密码要 4–32 位，且不含空格', true);
    ok.disabled = true; ok.innerHTML = '<span class="spin"></span>';
    try {
      const r = await api('/api/share', { method: 'POST', body: JSON.stringify({
        ids, ...ttl, password: pw || undefined,
        allowPreview: perm.pv, allowDownload: perm.dl, allowSave: perm.sv, allowWatermark: perm.wm
      }) });
      showShareResult(r.share);
    } catch (e) {
      ok.disabled = false; ok.innerHTML = I.share + '生成链接';
      toast(e.message, true);
    }
  });
}

/** 一行权限勾选框：勾上 = 允许。
    用和文件列表同一个勾选框控件（.cb），不另造一个开关 ——
    同一个系统里两种勾选样式，会让人怀疑它们的行为是不是也不一样。

    用 <div> 而不是 <label>：label 是行内元素，里面那个 display:flex 的
    勾选框在部分浏览器里算不出行盒宽度，会掉到文字下面去（实测过）。
    点整行都能切，行为上和 label 一样。 */
function permRow(key, title) {
  return `<div class="perm-row" data-perm-row="${esc(key)}">
    <span class="cb on" data-perm="${esc(key)}" role="checkbox" aria-checked="true">${I.check}</span>
    <span class="perm-txt">${esc(title)}</span>
  </div>`;
}

/** 分享管理里的四个权限开关：预览 下载 保存 水印。
    用紧凑的 ✓ / ✗ 形式而不是方框勾选框 —— 四个 16px 方框加上文字
    会挤到换行，这套只占不到一半宽度，稳在一行里。
    可以直接改已有分享的权限（点一下即时生效），不必删了重建。 */
function permToggles(perm) {
  const p = perm || {};
  const on = k => p[k] !== false;
  return [['pv', '预览'], ['dl', '下载'], ['sv', '保存'], ['wm', '水印']]
    .map(([k, label]) =>
      `<span class="pt${on(k) ? ' on' : ''}" data-perm-set="${esc(k)}"
             role="checkbox" aria-checked="${on(k)}" title="点击切换">${on(k) ? '✓' : '✗'}${esc(label)}</span>`)
    .join('');
}

function ttlText(expireAt) {
  if (expireAt == null) return '永久有效';
  const left = expireAt - Date.now();
  if (left <= 0) return '已过期';
  const h = Math.floor(left / 3600000), m = Math.floor(left % 3600000 / 60000);
  return h ? `${h} 小时 ${m} 分后失效` : `${m} 分钟后失效`;
}

/** 时长选择器：天/时/分 三个输入框 + 永久有效开关。
    创建分享和续期共用。返回外层容器 HTML，读值用 readTtlPicker(root)。 */
function ttlPickerHTML(pickerId, permId, defaultDays) {
  return `<div class="ttl-pick" id="${esc(pickerId)}">
    <input class="input tp-n" id="${esc(pickerId)}_d" type="number" min="0" max="3650" value="${defaultDays || 0}"><span class="tp-u">天</span>
    <input class="input tp-n" id="${esc(pickerId)}_h" type="number" min="0" max="23" value="2"><span class="tp-u">时</span>
    <input class="input tp-n" id="${esc(pickerId)}_m" type="number" min="0" max="59" value="0"><span class="tp-u">分</span>
    <button class="btn-ghost tp-perm" id="${esc(permId)}" type="button">永久有效</button>
  </div>`;
}

/** 读选择器的值。永久 → {permanent:true}；否则 {ttlMs}；全 0/非法 → null */
function readTtlPicker(pickerId, permId) {
  if ($(permId).classList.contains('on')) return { permanent: true };
  const d = parseInt($(pickerId + '_d').value, 10) || 0;
  const h = parseInt($(pickerId + '_h').value, 10) || 0;
  const m = parseInt($(pickerId + '_m').value, 10) || 0;
  const ms = ((d * 24 + h) * 60 + m) * 60 * 1000;
  if (ms < 60 * 1000) return null;
  return { ttlMs: ms };
}

/**
 * 分享结果：一次分享只有一个链接、一个密码。
 *
 * 无论选几项都只生成一条链接、一个密码，对方打开后看到这几项，
 * 不需要自己对应「哪个密码是哪个文件的」。「一起发」以底部按钮呈现，
 * 不重复展示链接与密码。
 */
function showShareResult(share) {
  const items = share.items || [];
  const many = items.length > 1;
  const head = items[0] || { name: '（空）', type: 'file' };
  const title = many ? `${head.name} 等 ${items.length} 项` : head.name;
  const isFolder = !many && head.type === 'folder';
  /* 带密码片段的链接：对方打开即自动填入密码，不用手输。
     片段不会发到服务器，密码不经过网络。 */
  const autoUrl = `${share.url}#p=${encodeURIComponent(share.password)}`;

  openSheet(`
    <h3>链接已生成</h3>
    <div class="share-card">
      <div class="sc-head">
        <span class="fico ${isFolder ? 'folder' : ''}">${isFolder ? I.folder : I.file}</span>
        <span class="sc-name">${esc(title)}</span>
        <span class="sc-ttl">${esc(ttlText(share.expireAt))}</span>
      </div>
      <div class="kv">
        <label>链接</label>
        <span class="val" title="${esc(share.url)}">${esc(share.url)}</span>
        <button class="copy" data-copy="${esc(share.url)}" title="复制链接">${I.copy}</button>
      </div>
      <div class="kv">
        <label>密码</label>
        <span class="val pw">${esc(share.password)}</span>
        <button class="copy" data-copy="${esc(share.password)}" title="复制密码">${I.copy}</button>
      </div>
    </div>
    <p class="hint">关闭窗口后密码将不再显示，请先复制保存。「复制链接和密码」发给对方后，打开即自动填入密码。</p>
    <div class="sheet-act">
      <button class="btn-ghost" data-x="done">关闭</button>
      <button class="btn" data-copy="${esc(autoUrl)}">${I.copy}复制链接和密码</button>
    </div>`, refreshSharesBadge);

  sheet.querySelector('[data-x="done"]').addEventListener('click', closeSheet);
}

    <p class="hint">撤销后链接与密码立即失效。已过期的分享将自动从列表移除。改密后旧密码立即作废。</p>
    <div class="mg-list">${body}</div>

      <button class="btn-ghost" data-x="close">关闭</button>
    </div>`, refreshSharesBadge);

  sheet.querySelector('[data-x="close"]').addEventListener('click', closeSheet);

  /* 权限开关：点一下即时生效，不弹确认 ——
     这是可逆的小设置，多一步确认反而烦。失败就把界面改回去。 */
  sheet.querySelectorAll('[data-perm-set]').forEach(el => {
    el.addEventListener('click', async () => {
      const item = el.closest('[data-tok]');
      const token = item && item.dataset.tok;
      if (!token) return;
      const key = el.dataset.permSet;
      const nowOn = !el.classList.contains('on');

      el.style.pointerEvents = 'none';
      try {
        const r = await api('/api/share/perm', {
          method: 'POST',
          body: JSON.stringify({ token, perm: { [key]: nowOn } })
        });
        /* 用服务端回来的最终状态渲染，别拿本地的乐观值 ——
           万一服务端做了额外约束，界面要跟着它走 */
        applyPermToggles(item, r.perm);
      } catch (e) {
        toast(e.message || '改不了这条权限', true);
      } finally {
        el.style.pointerEvents = '';
      }
    });
  });
}

/** 按服务端给的 perm 重画一条分享上的四个开关 */
function applyPermToggles(item, perm) {
  const p = perm || {};
  item.querySelectorAll('[data-perm-set]').forEach(el => {
    const on = p[el.dataset.permSet] !== false;
    el.classList.toggle('on', on);
    el.setAttribute('aria-checked', String(on));
    el.textContent = (on ? '✓' : '✗') + el.textContent.replace(/^[✓✗]/, '');
  });
}
