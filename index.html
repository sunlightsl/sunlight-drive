/**
 * 绑定中：二维码 + 手动密钥 + 填码启用。
 * @param {null|object} got 已经拿到的 {secret, uri, qr}；null 表示要现取
 */
async function tfSetupView(got) {
  if (!got) {
    try {
      got = await api('/api/account/2fa/start', { method: 'POST', body: '{}' });
    } catch (e) {
      return toast(e.message, true);
    }
  }

  openSheet(`
    <h3>绑定验证器</h3>
    <ol class="steps">
      <li>用验证器 App 扫下面的二维码，扫不上就手动输密钥。</li>
      <li>把 App 上显示的 6 位数字填到下边，确认能对上才算绑好。</li>
    </ol>
    <div class="qr">
      <svg viewBox="0 0 ${got.qr.dim} ${got.qr.dim}" shape-rendering="crispEdges"
           role="img" aria-label="两步验证二维码"><path d="${got.qr.path}"/></svg>
    </div>
    <div class="secret">
      <code>${esc(got.secret)}</code>
      <button id="tfCopy">复制</button>
    </div>
    <div class="field" style="margin-top:18px">
      <label for="tfCode">6 位动态码</label>
      <input class="input mono" id="tfCode" inputmode="numeric" autocomplete="one-time-code"
             maxlength="6" placeholder="000000" spellcheck="false">
    </div>
    <div class="sheet-act">
      <button class="btn-ghost" id="tfCancel">取消</button>
      <button class="btn" id="tfOk"><span class="lbl">确认启用</span></button>
    </div>
  `);

  setTimeout(() => $('tfCode').focus(), 60);

  $('tfCopy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(got.secret);
      toast('密钥已复制');
    } catch (_) {
      /* 非 https 下剪贴板接口会被拒。退回选中，让用户自己按 Ctrl+C */
      const c = document.querySelector('.secret code');
      const r = document.createRange();
      r.selectNodeContents(c);
      const s = getSelection();
      s.removeAllRanges(); s.addRange(r);
      toast('已选中，按 Ctrl/⌘+C 复制');
    }
  });

  $('tfCancel').addEventListener('click', async () => {
    try {
      const d = await api('/api/account/2fa/cancel', { method: 'POST', body: '{}' });
      applyAccount(d.account);
    } catch (_) {}
    closeSheet();
  });

  const submit = async () => {
    const code = $('tfCode').value.trim();
    if (code.length !== 6) return toast('请输入 6 位数字', true);
    const btn = $('tfOk');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try {
      const d = await api('/api/account/2fa/enable', {
        method: 'POST', body: JSON.stringify({ code })
      });
      applyAccount(d.account);
      closeSheet();
      toast('两步验证已开启');
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false; btn.innerHTML = '<span class="lbl">确认启用</span>';
      $('tfCode').select();
    }
  };

  $('tfOk').addEventListener('click', submit);
  $('tfCode').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, ''); });
  $('tfCode').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
}

$('btnProfile').addEventListener('click', e => {
  e.stopPropagation();
  if (menu.classList.contains('on') && menu.classList.contains('acct')) return closeMenu();
  S.account && S.account.username ? openAccountMenu($('btnProfile')) : loadAccount().then(() => {
    $('btnProfile').click();
  });
});

/* 品牌名里中西文交界处塞一个细空格（U+2009）：
   「Sunlight云盘」的 t 和 云 直接贴着显挤，浏览器不会自动给这个间隙 */
const brandSpaced = s => String(s)
  .replace(/([A-Za-z0-9])([\u4e00-\u9fff])/g, '$1\u2009$2')
  .replace(/([\u4e00-\u9fff])([A-Za-z0-9])/g, '$1\u2009$2');

/* ================================================================
   启动
   ================================================================ */
let booted = false;
async function boot() {
  if (booted) return;
  booted = true;
  await loadAccount();
  try {
    await loadFlat();
  } catch (e) {
    if (!e.handled) toast('加载文件列表失败：' + e.message, true);
  }
  await loadDir(null);
  refreshSharesBadge();
}

(async function init() {
  syncViewBtn();

  /* 上次没传完的记录先读进来。这里**不显示**：登录前展示文件列表没意义，
     而且换个人登录时不该看到上一个人的文件名。等进了主界面再渲染。 */
  S.pending = loadPending();

  // 先问站点信息：品牌叫什么、开不开注册、用户名和密码有什么要求
  try {
    const r = await fetch('/api/site', { cache: 'no-store' });
    if (r.ok) {
      S.meta = await r.json();
      if (S.meta.brand) {
        $('brandName').textContent = brandSpaced(S.meta.brand);
        $('gateTitle').textContent = brandSpaced(S.meta.brand);
        document.title = brandSpaced(S.meta.brand);
      }
    }
  } catch (_) {}

  /* 拿不到站点信息也得有个名字顶着，否则登录门左边那块是空的 */
  if (!S.meta.brand) {
    $('brandName').textContent = 'Sunlight\u2009云盘';
    $('gateTitle').textContent = 'Sunlight\u2009云盘';
  }

  /* 关掉注册的部署里不该出现"注册"这个入口 ——
     让人点进去填完一整张表才被告知不开放，是最没必要的一种失望。 */
  if (S.meta.registrationOpen === false) $('footLogin').style.display = 'none';

  $('user').value = lastUser();

  const restored = await tryRestore();
  if (!restored) {
    $('gate').classList.remove('off');
    gotoStep(1);
  }
  /* 进了主界面才把"上次没传完"摆出来。放在这里是因为登录前渲染没意义，
     而且换个人登录时不该看到上一个人的文件名。 */
  renderRecovery();
})();
</script>
<!-- ============================================================
     预览弹层（图片 / 视频 / 音频 / PDF）
     ------------------------------------------------------------
     和"下载"是两个独立动作：点文件 = 预览，行尾「⋯ → 下载」= 下载原文件。
     没有 JS 时这段是 display:none，不会挡住页面 —— 预览是增强，不是必需。

     这段在主站和分享页里是**逐字相同**的，配套的 CSS 块（.pv-*）也是。
     改动请两边一起改，否则同一个控件在两个页面表现不一致。
     ============================================================ -->
<div class="pv" id="pv" hidden>
  <div class="pv-h">
    <span class="pv-name" id="pvName"></span>
    <span class="pv-nav">
      <button id="pvPrev" title="上一个（←）" aria-label="上一个">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="pv-count" id="pvCount"></span>
      <button id="pvNext" title="下一个（→）" aria-label="下一个">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </span>
    <span class="pv-acts">
      <button class="pv-act" id="pvOpen" title="在新窗口打开">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
      </button>
      <button class="pv-act" id="pvDl" title="下载原文件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>
      </button>
      <button class="pv-act" id="pvClose" title="关闭（Esc）" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </span>
  </div>
  <div class="pv-b" id="pvBody"></div>
</div>

<script>
/* ============================================================
   预览弹层的行为。依赖调用方提供两件东西：
     getUrl(id)      → Promise<{url, kind, fileName}>   （主站与分享页的接口不同）
     download(id)    → 触发下载（复用各页已有的逻辑）
   ============================================================ */
(function () {
  var el = document.getElementById('pv');
  if (!el) return;
  var body = document.getElementById('pvBody');
  var nameEl = document.getElementById('pvName');
  var countEl = document.getElementById('pvCount');
  var btnPrev = document.getElementById('pvPrev');
  var btnNext = document.getElementById('pvNext');
  var btnDl = document.getElementById('pvDl');
  var btnOpen = document.getElementById('pvOpen');
  var btnClose = document.getElementById('pvClose');

  /* 当前列表里所有"可预览"的文件，按列表顺序 —— 左右键就在这个数组里走 */
  var list = [];
  var at = -1;
  var cur = null;          // { url, kind, fileName }
  var token = 0;           // 并发保护：切太快时，旧的响应不许覆盖新的
  var blobUrl = '';        // PDF 用的 object URL；切走/关闭时必须释放，否则整份文件留在内存里

  /* 释放上一个 blob URL。不释放的话每翻一页 PDF 就漏一份文件大小的内存 */
  function revokeBlob() {
    if (blobUrl) { try { URL.revokeObjectURL(blobUrl); } catch (e) {} blobUrl = ''; }
  }
  var opts = {};

  function render() {
    var n = list[at];
    if (!n) return;
    nameEl.textContent = n.name;
    nameEl.title = n.name;
    countEl.textContent = list.length > 1 ? (at + 1) + ' / ' + list.length : '';
    btnPrev.disabled = list.length < 2;
    btnNext.disabled = list.length < 2;

    var my = ++token;
    revokeBlob();
    body.innerHTML = '<div class="pv-msg">加载中…</div>';

    Promise.resolve(opts.getUrl(n.id)).then(async function (d) {
      if (my !== token) return;               // 已经切走了，丢掉这个响应
      cur = d;
      var kind = d.kind || n.pv;
      if (kind === 'image') {
        var img = document.createElement('img');
        img.className = 'pv-media';
        img.alt = n.name;
        img.onerror = function () {
          if (my === token) body.innerHTML = '<div class="pv-msg">图片加载失败，可以试试下载后查看</div>';
        };
        img.src = d.url;
        body.innerHTML = '';
        body.appendChild(img);
      } else if (kind === 'video') {
        var v = document.createElement('video');
        v.className = 'pv-media';
        v.controls = true;
        v.autoplay = true;          // 用户是主动点的，播放是预期行为
        v.playsInline = true;
        v.preload = 'metadata';     // 不预载整个文件，只拉头部
        v.src = d.url;
        v.onerror = function () {
          if (my === token) body.innerHTML = '<div class="pv-msg">这个视频浏览器放不了（可能是编码或容器不兼容），可以下载后用本地播放器打开</div>';
        };
        body.innerHTML = '';
        body.appendChild(v);
      } else if (kind === 'audio') {
        var a = document.createElement('audio');
        a.className = 'pv-media';
        a.controls = true;
        a.autoplay = true;
        a.src = d.url;
        body.innerHTML = '';
        body.appendChild(a);
      } else {
        /* PDF：取回来自己转成 blob URL 再看。
           为什么不直接把签名 URL 塞进 iframe：对象的 Content-Disposition 是
           attachment（实测这个 bucket 上 OSS **忽略** response-content-disposition，
           覆盖不了），而 iframe 在部分浏览器里被当成顶层导航 ——
           于是会触发下载而不是显示。转成 blob 之后类型完全由我们说了算，
           手机上"iframe 不渲染 PDF"的老问题也一并绕开了。 */
        try {
          var resp = await fetch(d.url);
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          /* 用白名单里的类型，不用 OSS 回的 —— 它可能是 octet-stream */
          var blob = new Blob([await resp.arrayBuffer()], { type: 'application/pdf' });
          revokeBlob();
          blobUrl = URL.createObjectURL(blob);
          var f = document.createElement('iframe');
          f.className = 'pv-media';
          f.src = blobUrl;
          f.title = n.name;
          body.innerHTML = '';
          body.appendChild(f);
        } catch (err) {
          if (my !== token) return;
          body.innerHTML = '<div class="pv-msg">PDF 加载失败，可以试试右上角的下载</div>';
        }
      }
      /* 预取下一张图片，左右切换时更顺。失败无所谓，不处理 */
      var nx = list[at + 1];
      if (nx && nx.pv === 'image' && opts.getUrl) {
        Promise.resolve(opts.getUrl(nx.id)).then(function (nd) {
          if (my === token && nd && nd.url) { var pre = new Image(); pre.src = nd.url; }
        }).catch(function () {});
      }
    }).catch(function (e) {
      if (my !== token) return;
      cur = null;
      body.innerHTML = '<div class="pv-msg">' + escHtml(e && e.message || '打不开这个文件') + '</div>';
    });
  }

  /* 停止正在播放的声音 —— 否则关掉弹层或切走之后声音还在响 */
  function stopMedia() {
    revokeBlob();
    var m = body.querySelector('audio, video');
    if (m) { try { m.pause(); m.removeAttribute('src'); m.load(); } catch (e) {} }
    body.innerHTML = '';
  }

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function open(nodes, id, options) {
    opts = options || {};
    /* 只有能预览的才进列表：预览一张图时按右键，应该走到下一张图，
       而不是跳到一个打不开的 zip 上 */
    list = (nodes || []).filter(function (n) { return n && n.type === 'file' && n.pv; });
    at = list.findIndex(function (n) { return n.id === id; });
    if (at < 0) return false;
    el.hidden = false;
    document.documentElement.classList.add('pv-lock');
    render();
    btnClose.focus();
    return true;
  }

  function close() {
    token++;
    revokeBlob();
    if (cur && opts.onClose) { try { opts.onClose(); } catch (e) {} }
    cur = null;
    el.hidden = true;
    document.documentElement.classList.remove('pv-lock');
    stopMedia();
  }

  function step(d) {
    if (list.length < 2) return;
    stopMedia();
    at = (at + d + list.length) % list.length;   // 首尾相接
    render();
  }

  btnClose.addEventListener('click', close);
  btnPrev.addEventListener('click', function () { step(-1); });
  btnNext.addEventListener('click', function () { step(1); });
  el.addEventListener('click', function (e) {
    /* 点弹层的空白背景 = 关闭。点内容本身不关 */
    if (e.target === el || e.target === body) close();
  });

  btnDl.addEventListener('click', function () {
    if (list[at]) opts.download(list[at].id);
  });
  /* 新窗口打开：PDF 在手机上可能要借这条路 */
  btnOpen.addEventListener('click', function () {
    if (cur && cur.url) window.open(cur.url, '_blank', 'noopener');
  });

  document.addEventListener('keydown', function (e) {
    if (el.hidden) return;
    if (e.key === 'Escape') { close(); }
    else if (e.key === 'ArrowLeft') { step(-1); }
    else if (e.key === 'ArrowRight') { step(1); }
  });

  /* 手机上左右滑 —— 看一组照片时这是最自然的动作 */
  var tx = 0, ty = 0;
  body.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  body.addEventListener('touchend', function (e) {
    if (e.touches.length) return;
    var dx = (e.changedTouches[0].clientX - tx);
    var dy = (e.changedTouches[0].clientY - ty);
    /* 横向位移要够大，且明显比纵向大 —— 否则会和上下滚动/双击缩放打架 */
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
  }, { passive: true });

  window.PV = { open: open, close: close, isOpen: function () { return !el.hidden; } };
})();
</script>

</body>
</html>
