<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Sunlight云盘</title>
<style>
  /* ===== 主题：浅色为默认，html[data-theme="dark"] 切暗色 ===== */
  :root{
    --bg:#ffffff;
    --bg-elev:#fafafa;
    --bg-hover:#f4f4f5;
    --bg-sunken:#f7f7f8;
    --border:#e6e6e8;
    --border-strong:#d4d4d8;
    --text:#18181b;
    --text-dim:#6b7280;
    --text-faint:#9ca3af;
    --accent:#5e6ad2;
    --accent-hover:#4f5ac0;
    --accent-soft:rgba(94,106,210,.08);
    /* 品牌字用渐变上色，两个色标跟着主题走，保证两边都够清楚 */
    --brand-a:#4f46e5;
    --brand-b:#7c3aed;
    --green:#1a9c62;
    --green-soft:rgba(26,156,98,.08);
    --amber:#b7791f;
    --amber-soft:rgba(183,121,31,.08);
    --red:#dc2626;
    --red-soft:rgba(220,38,38,.07);
    --glow:rgba(94,106,210,.10);
    --item-hover:rgba(0,0,0,.016);
    --sel-bg:rgba(94,106,210,.055);
    --shadow:0 24px 64px rgba(0,0,0,.13);
    --shadow-sm:0 6px 20px rgba(0,0,0,.09);
    --scrim:rgba(24,24,27,.42);
  /* 预览灯箱的遮罩单独一套。
     不能复用 --scrim：那是给对话框/选择器用的轻遮罩，
     压在列表上刚好，但预览时图片和视频的底色跟页面太接近，
     分不清自己是在预览里还是在列表里。灯箱要更实一些。 */
  --pv-scrim:rgba(24,24,27,.72);
    --radius:10px;
    --radius-sm:6px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#08090a;
    --bg-elev:#0f1011;
    --bg-hover:#141516;
    --bg-sunken:#0c0d0e;
    --border:#1f2023;
    --border-strong:#2b2d31;
    --text:#f7f8f8;
    --text-dim:#8a8f98;
    --text-faint:#62666d;
    --accent:#5e6ad2;
    --accent-hover:#6e79dd;
    --accent-soft:rgba(94,106,210,.12);
    /* 暗底上提亮一档，避免渐变落到深色里发闷 */
    --brand-a:#818cf8;
    --brand-b:#c4b5fd;
    --green:#4cb782;
    --green-soft:rgba(76,183,130,.12);
    --amber:#d4a548;
    --amber-soft:rgba(212,165,72,.12);
    --red:#e5534b;
    --red-soft:rgba(229,83,75,.1);
    --glow:rgba(94,106,210,.14);
    --item-hover:rgba(255,255,255,.014);
    --sel-bg:rgba(94,106,210,.1);
    --shadow:0 24px 64px rgba(0,0,0,.6);
    --shadow-sm:0 6px 20px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.7);
  /* 暗色下页面本身就是深的，遮罩要比页面更暗才拉得开层次 */
  --pv-scrim:rgba(0,0,0,.82);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:14px;line-height:1.6;min-height:100vh;position:relative;
  }
  body::before{
    content:"";position:fixed;top:-240px;left:50%;
    width:1000px;height:520px;transform:translateX(-50%);
    background:radial-gradient(ellipse at center,var(--glow),transparent 65%);
    pointer-events:none;z-index:0;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px;position:relative;z-index:1}
  button{font-family:var(--sans)}

  /* ================= 登录门 =================
     左右分栏 + 毛玻璃。左边只放品牌（纯视觉，不写说明文字），右边是表单。
     两步（密码 / 动态码）都在右侧切换，左侧始终不动 —— 切换时页面不跳。 */
  .gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:28px;position:relative;z-index:2;overflow:hidden;
  }
  .gate.off{display:none}

  /* 背景光斑：毛玻璃得有东西可以透，不然 blur 根本看不出来 */
  .gate-glow{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
  .gate-glow.a{width:520px;height:520px;top:-170px;left:-130px;background:rgba(94,106,210,.38)}
  .gate-glow.b{width:480px;height:480px;bottom:-190px;right:-110px;background:rgba(124,138,232,.32)}

  .gate-card{
    position:relative;z-index:1;
    width:100%;max-width:860px;min-height:330px;
    display:grid;grid-template-columns:1fr 1.12fr;
    border-radius:20px;overflow:hidden;
    /* 半透明度调得比较低是有意的 —— 太实就是一块白板，看不出玻璃 */
    background:color-mix(in srgb,var(--bg) 62%,transparent);
    backdrop-filter:blur(26px) saturate(170%);
    border:1px solid color-mix(in srgb,var(--border) 70%,transparent);
    box-shadow:0 26px 70px -16px rgba(16,20,48,.26),0 8px 26px -10px rgba(16,20,48,.12);
  }

  /* ---- 左：品牌视觉（纯装饰，不放文案） ---- */
  .gate-side{
    position:relative;padding:36px 32px;
    display:flex;flex-direction:column;justify-content:center;gap:20px;
    background:linear-gradient(155deg,#5866d4,#7b88e6 48%,#98a5ef);
    color:#fff;overflow:hidden;
  }
  .gate-side::before,.gate-side::after{content:"";position:absolute;border-radius:50%}
  .gate-side::before{
    width:190px;height:190px;left:-70px;top:-60px;
    background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%);
  }
  .gate-side::after{
    width:320px;height:320px;right:-120px;bottom:-100px;
    background:radial-gradient(circle,rgba(255,255,255,.30),transparent 66%);
  }
  /* 品牌标识：不带框，直接一枚大图标悬在名字上方 */
  .gs-mark{
    position:relative;width:72px;height:72px;
    display:flex;align-items:center;justify-content:center;
  }
  .gs-mark svg{width:72px;height:72px;stroke-width:1.5}
  .gs-name{position:relative;font-size:31px;font-weight:600;letter-spacing:-.035em;line-height:1.05}
  /* 左栏就一句话，光有名字会显得空。这句是品牌语，不是功能说明。 */
  .gs-slogan{
    position:relative;margin-top:-8px;
    font-size:13px;line-height:1.7;letter-spacing:.04em;
    color:rgba(255,255,255,.8);
  }

  /* ---- 右：表单 ---- */
  .gate-form{padding:48px 44px;display:flex;flex-direction:column;justify-content:center}
  .gate-form h2{font-size:21px;font-weight:600;letter-spacing:-.02em;margin-bottom:22px}
  .gate-input{
    width:100%;background:color-mix(in srgb,var(--bg) 66%,transparent);
    border:1px solid var(--border);color:var(--text);font-family:var(--sans);
    font-size:14.5px;padding:13px 15px;border-radius:10px;outline:none;letter-spacing:.05em;
    transition:border-color .16s,box-shadow .16s,background .16s;
  }
  .gate-input::placeholder{letter-spacing:0;color:var(--text-faint)}
  .gate-input:focus{
    border-color:var(--accent);background:var(--bg);
    box-shadow:0 0 0 3.5px var(--accent-soft);
  }
  .gate-input + .gate-input{margin-top:10px}
  .gate-input.code{font-family:var(--mono);font-size:20px;letter-spacing:.32em;text-indent:.32em}
  .gate-btn{
    width:100%;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:7px;
    background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:13px;font-size:14.5px;font-weight:500;cursor:pointer;
    box-shadow:0 10px 22px -10px rgba(94,106,210,.65);
    transition:background .15s,transform .12s,box-shadow .15s;
  }
  .gate-btn:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 14px 26px -10px rgba(94,106,210,.7)}
  .gate-btn:active{transform:translateY(0)}
  .gate-btn:disabled{background:var(--bg-hover);color:var(--text-faint);cursor:default;box-shadow:none;transform:none}
  /* 底部那一行「还没有账号？」——和「返回上一步」一个体量，
     让"换一条路"的入口看起来是次要动作，不跟主按钮抢注意力 */
  .gate-foot{
    margin-top:18px;padding-top:16px;text-align:center;font-size:12.5px;color:var(--text-faint);
    border-top:1px solid color-mix(in srgb,var(--border) 70%,transparent);
  }
  .gate-foot a{color:var(--accent);cursor:pointer;font-weight:500;margin-left:3px}
  .gate-foot a:hover{text-decoration:underline}
  /* 注册表单比登录多一个输入框，卡片高度会跳一下。
     压住最小高度，切回来的时候不要缩。 */
  .gate-form{min-height:270px}
  .gate-err{margin-top:13px;font-size:12.5px;color:var(--red);display:none;line-height:1.5}
  .gate-err.on{display:block}
  .gate-back{
    display:block;text-align:center;margin-top:16px;font-size:12.5px;
    color:var(--text-faint);cursor:pointer;transition:color .15s;
  }
  .gate-back:hover{color:var(--text-dim)}
  /* TOTP 周期进度条：动态码每 30 秒换一次，让用户知道还剩多久 */
  .period{margin-top:16px}
  .period-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
  .period-fill{height:100%;background:var(--accent);width:100%;transition:width .95s linear}
  .period-txt{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:8px;text-align:center}
  .spin{
    width:14px;height:14px;border:1.5px solid rgba(255,255,255,.35);
    border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .app{display:none}
  .app.on{display:block}

  /* ================= 顶栏 ================= */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:var(--bg);                                  /* 老浏览器回退 */
    background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--border);
  }
  .topbar-in{
    max-width:1000px;margin:0 auto;padding:0 24px;height:58px;
    display:flex;align-items:center;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
  .brand svg{width:21px;height:21px;color:var(--accent);flex-shrink:0}
  .brand span{
    font-size:14.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;
    /* 品牌字：渐变直接裁进字形里，不额外加描边或投影，暗浅两版都读得清 */
    background-image:linear-gradient(92deg,var(--brand-a) 6%,var(--brand-b) 94%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .top-acts{display:flex;align-items:center;gap:7px}

  /* ================= 按钮 ================= */
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);
    padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;
    transition:all .15s;white-space:nowrap;
  }
  .btn:hover{background:var(--accent-hover)}
  .btn:active{transform:translateY(.5px)}
  .btn:disabled{background:var(--bg-hover);color:var(--text-faint);cursor:default}
  .btn svg{width:14px;height:14px;flex-shrink:0}
  /* 上传按钮尾部的下拉小箭头：只做提示用，不抢主体的视觉重量 */
  .btn .caret{width:11px;height:11px;opacity:.85;margin-left:-2px}
  .btn-ghost{
    background:var(--bg-elev);color:var(--text-dim);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:8px 13px;font-size:13px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:all .15s;white-space:nowrap;
  }
  .btn-ghost:hover{color:var(--text);border-color:var(--border-strong);background:var(--bg-hover)}
  .btn-ghost svg{width:14px;height:14px;flex-shrink:0}
  .btn-danger{background:var(--red);color:#fff}
  .btn-danger:hover{filter:brightness(1.08)}
  .btn-danger:disabled{background:var(--bg-hover);color:var(--text-faint);filter:none}
  .icon-btn{
    width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text-dim);cursor:pointer;transition:all .15s;
  }
  .icon-btn:hover{color:var(--text);border-color:var(--border-strong);background:var(--bg-hover)}
  .icon-btn svg{width:15px;height:15px;display:block}
  .icon-btn:disabled{opacity:.35;cursor:default}
  .icon-btn:disabled:hover{color:var(--text-dim);border-color:var(--border);background:var(--bg-elev)}

  /* 顶栏头像。没用 .icon-btn 的方框，是因为头像是圆的，
     套在方框里像贴了张邮票。 */
  .ava-btn{
    padding:0;border:none;background:transparent;cursor:pointer;
    border-radius:50%;line-height:0;flex-shrink:0;
    transition:transform .12s,box-shadow .16s;
  }
  .ava-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px -4px rgba(16,20,48,.4)}
  .ava-btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
  .ava{
    width:32px;height:32px;border-radius:50%;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:#fff;
    font-size:13px;font-weight:600;user-select:none;
  }
  .ava img{width:100%;height:100%;object-fit:cover;display:block}
  .ava.lg{width:66px;height:66px;border-radius:20px;font-size:26px}

  /* ---------- 头像下拉菜单 ----------
     容器和条目样式复用「浮动菜单」那一套（.menu / .menu button），
     这里只补它没有的两样：顶部的账号抬头，和右侧的小尾巴。 */
  .menu.acct{min-width:212px}
  .menu-head{
    display:flex;align-items:center;gap:10px;padding:8px 9px 10px;margin-bottom:4px;
    border-bottom:1px solid var(--border);
  }
  .menu-head .ava{width:34px;height:34px;font-size:14px}
  .menu-id{min-width:0;flex:1}
  .menu-id b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .menu-id span{display:block;font-family:var(--mono);font-size:11px;color:var(--text-faint);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .menu button .tail{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-faint)}
  .menu button.danger:hover{background:color-mix(in srgb,var(--red) 12%,transparent)}

  /* ---------- 账号面板 ---------- */
  .acct-row{display:flex;align-items:baseline;gap:12px;padding:9px 0;font-size:13.5px;
    border-bottom:1px solid var(--border)}
  .acct-row:last-of-type{border-bottom:none}
  .acct-row .k{width:76px;flex-shrink:0;color:var(--text-dim);font-size:13px}
  .acct-row .v{flex:1;min-width:0;word-break:break-all}
  .acct-row .v.mono{font-family:var(--mono);font-size:12.5px}
  /* 行内小文字按钮：不抢戏，但得看得出能点。昵称那一行用。 */
  .linkish{
    background:none;border:none;padding:0 2px;margin-left:10px;flex-shrink:0;
    font-family:var(--sans);font-size:12.5px;color:var(--accent);cursor:pointer;
  }
  .linkish:hover{text-decoration:underline}
  .linkish:disabled{color:var(--text-faint);cursor:default;text-decoration:none}
  .acct-row .v.nick{display:flex;align-items:center}
  .acct-row .v.nick .nick-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct-row .v.nick .input{flex:1;min-width:0;padding:6px 9px;font-size:13px}
  /* 状态点：开着 / 没开，一眼能看出来，不用读一整句话 */
  .dot{display:inline-flex;align-items:center;gap:6px;font-size:13px}
  .dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--text-faint)}
  .dot.on::before{background:var(--green)}
  .dot.off::before{background:var(--text-faint)}

  /* 二维码：必须深色码点 + 白底，扫描器不认深色背景上的浅色码。
     所以这块固定用白底，不跟随主题。 */
  .qr{
    width:196px;height:196px;padding:14px;margin:4px auto 0;
    background:#fff;border-radius:14px;border:1px solid var(--border);
  }
  .qr svg{width:100%;height:100%;display:block}
  .qr svg path{fill:#111}
  .secret{
    display:flex;align-items:center;gap:8px;margin-top:16px;
    background:var(--bg-sunken);border:1px solid var(--border);border-radius:9px;padding:9px 11px;
  }
  .secret code{
    flex:1;min-width:0;font-family:var(--mono);font-size:12px;letter-spacing:.09em;
    word-break:break-all;line-height:1.5;color:var(--text-dim);
  }
  .secret button{
    flex-shrink:0;background:none;border:none;color:var(--accent);cursor:pointer;
    font-family:var(--sans);font-size:12px;padding:2px 4px;border-radius:5px;
  }
  .secret button:hover{background:var(--accent-soft)}
  .steps{counter-reset:s;margin:18px 0 0;padding:0;list-style:none}
  .steps li{
    counter-increment:s;display:flex;gap:10px;font-size:13px;color:var(--text-dim);
    margin-bottom:9px;line-height:1.5;
  }
  .steps li::before{
    content:counter(s);flex-shrink:0;width:18px;height:18px;border-radius:50%;
    background:var(--bg-hover);color:var(--text-faint);font-family:var(--mono);font-size:11px;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .icon-btn .i-sun{display:none}
  html[data-theme="dark"] .icon-btn .i-sun{display:block}
  html[data-theme="dark"] .icon-btn .i-moon{display:none}
  .icon-btn.badge-dot{position:relative}
  .icon-btn.badge-dot::after{
    content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;
    border-radius:50%;background:var(--accent);
  }

  /* ================= 面包屑 ================= */
  .crumbbar{display:flex;align-items:center;gap:10px;padding:24px 0 0;min-height:24px}
  .crumbs{display:flex;align-items:center;gap:7px;font-size:13.5px;flex-wrap:wrap;flex:1;min-width:0}
  .crumbs a{color:var(--text-dim);cursor:pointer;transition:color .15s;white-space:nowrap}
  .crumbs a:hover{color:var(--text)}
  .crumbs .cur{color:var(--text);font-weight:500;white-space:nowrap}
  .crumbs .sep{color:var(--text-faint);font-size:12px}
  .crumbs .cnt{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);margin-left:2px}
  .crumbs .drop-on{color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 5px}

  /* ================= 工具栏 ================= */
  .toolbar{display:flex;align-items:center;gap:10px;padding:18px 0 16px;flex-wrap:wrap}
  .search{position:relative;flex:1;min-width:200px}
  .search>svg{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;color:var(--text-faint);pointer-events:none;
  }
  .search input{
    width:100%;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
    font-family:var(--sans);font-size:13.5px;padding:9px 12px 9px 33px;
    border-radius:var(--radius-sm);outline:none;transition:border-color .15s,background .15s;
  }
  .search input::placeholder{color:var(--text-faint)}
  .search input:focus{border-color:var(--accent);background:var(--bg-hover);box-shadow:0 0 0 3px var(--accent-soft)}
  /* 排序入口在各自的展示区里（列表表头 / 网格上方的排序条），
     工具栏不再挂一个排序下拉框，所以 .ctrls 和 .sel 一并撤掉。 */
  .icon-btn{flex-shrink:0}

  /* ================= 选择操作条 =================
     固定在视口底部，不占文档流。
     以前它是列表上方文档流里的一块（display:none ↔ flex 来回切），
     每勾选一次就插进来把整个列表往下推一截，取消又弹回去 ——
     页面跟着跳，看着很别扭。
     做成浮层之后列表纹丝不动，操作条自己从下方滑进来。 */
  .selbar{
    position:fixed;left:50%;bottom:26px;z-index:40;
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    width:max-content;max-width:min(calc(100vw - 32px),760px);
    background:var(--bg-sunken);border:1px solid rgba(94,106,210,.26);
    border-radius:12px;padding:9px 11px 9px 16px;
    box-shadow:0 10px 30px rgba(16,20,48,.13),0 2px 8px rgba(16,20,48,.07);
    opacity:0;pointer-events:none;
    transform:translate(-50%,calc(100% + 40px));
    transition:transform .26s cubic-bezier(.2,.85,.25,1),opacity .18s;
  }
  .selbar.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
  .selbar .cnt{font-size:13px;font-weight:500;color:var(--accent);white-space:nowrap}
  /* 按钮组：桌面端由 margin-left:auto 顶到右边，窄屏换行时整组一起走 */
  .selbar .sel-acts{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-left:auto}
  .selbar .btn-ghost{background:var(--bg);border-color:rgba(94,106,210,.24)}

  /* ================= 列表 ================= */
  .panel{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--bg)}
  .lhead{
    display:grid;grid-template-columns:26px 1fr 96px 104px 46px;
    align-items:center;gap:12px;padding:9px 14px;
    background:var(--bg-sunken);border-bottom:1px solid var(--border);
    font-size:11.5px;color:var(--text-faint);font-weight:500;
  }
  .lhead .sortable{cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;transition:color .15s}
  .lhead .sortable:hover{color:var(--text-dim)}
  .lhead .sortable svg{width:11px;height:11px;opacity:0;transition:opacity .15s}
  .lhead .sortable.on{color:var(--text)}
  .lhead .sortable.on svg{opacity:1}
  .lhead .r{text-align:right;justify-content:flex-end}

  /* 网格视图没有列头可点，排序入口就摆在网格上方这一条。
     样式和列表表头保持一套，点起来的感觉才一致。 */
  .gsort{
    display:flex;align-items:center;gap:16px;padding:9px 14px;
    background:var(--bg-sunken);border-bottom:1px solid var(--border);
    font-size:11.5px;color:var(--text-faint);font-weight:500;
  }
  .gsort .gsort-t{opacity:.7}
  .gsort .sortable{cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;transition:color .15s}
  .gsort .sortable:hover{color:var(--text-dim)}
  .gsort .sortable svg{width:11px;height:11px;opacity:0;transition:opacity .15s}
  .gsort .sortable.on{color:var(--text)}
  .gsort .sortable.on svg{opacity:1}

  .rows{max-height:max(200px,calc(100vh - 380px));overflow-y:auto}
  .row{
    display:grid;grid-template-columns:26px 1fr 96px 104px 46px;
    align-items:center;gap:12px;padding:0 14px;height:46px;
    border-bottom:1px solid var(--border);cursor:default;
    transition:background .1s;
  }
  .rows .row:last-child{border-bottom:none}
  .row:hover{background:var(--item-hover)}
  .row.sel{background:var(--sel-bg)}
  .row.dir{cursor:pointer}
  .row.drop-on{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(94,106,210,.3)}
  .row.dragging{opacity:.45}

  .fico{display:flex;align-items:center;color:var(--text-faint)}
  .fico svg{width:17px;height:17px;display:block}
  .fico.folder{color:var(--accent)}
  /* 图标不跟文字基线走。
     .fname 是 align-items:baseline（为了让「名字 + 路径」两种字号基线对齐），
     而 SVG 的基线就是它的底边 —— 跟着基线走会被整体抬到文字基线之上，
     看上去就是「图标偏上、和文字不齐」。这里单独让它按行居中。
     用 align-self 覆盖而不改 .fname，是为了不破坏路径小字的基线对齐。 */
  .fname .fico{align-self:center}
  .fname{
    display:flex;align-items:baseline;gap:8px;min-width:0;
    font-size:13.5px;overflow:hidden;
  }
  .fname .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.dir .fname .t{font-weight:500}
  .fname .path{
    font-family:var(--mono);font-size:10.5px;color:var(--text-faint);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1;min-width:0;
  }
  .fsize,.fdate{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);text-align:right}
  .fdate{color:var(--text-faint)}
  .fact{display:flex;justify-content:flex-end}
  .ract{
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    border:none;background:transparent;border-radius:4px;color:var(--text-faint);
    cursor:pointer;opacity:0;transition:all .15s;
  }
  .row:hover .ract,.row.sel .ract{opacity:1}
  .ract:hover{background:var(--bg-hover);color:var(--text)}
  .ract svg{width:15px;height:15px;display:block}

  /* 复选框 */
  .cb{
    width:16px;height:16px;border:1.5px solid var(--border-strong);border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .12s;flex-shrink:0;background:var(--bg);
  }
  .cb:hover{border-color:var(--accent)}
  .cb svg{width:11px;height:11px;color:#fff;opacity:0;transition:opacity .12s}
  .cb.on{background:var(--accent);border-color:var(--accent)}
  .cb.on svg{opacity:1}

  /* ================= 网格 ================= */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));
    gap:10px;padding:14px;
  }
  .card-t{
    position:relative;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--bg-elev);padding:16px 14px 14px;cursor:default;transition:all .15s;
    display:flex;flex-direction:column;gap:10px;min-height:132px;
  }
  .card-t:hover{border-color:var(--border-strong);background:var(--bg-hover)}
  .card-t.sel{border-color:var(--accent);background:var(--sel-bg);box-shadow:0 0 0 1px var(--accent) inset}
  .card-t.dir{cursor:pointer}
  .card-t.drop-on{border-color:var(--accent);background:var(--accent-soft)}
  .card-t .cb{position:absolute;top:10px;right:10px}
  .card-t .cico{color:var(--accent);display:flex}
  .card-t .cico.file{color:var(--text-faint)}
  .card-t .cico svg{width:28px;height:28px;display:block}
  .card-t .cname{font-size:13px;line-height:1.45;word-break:break-all;flex:1}
  .card-t.dir .cname{font-weight:500}
  .card-t .cmeta{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card-t .csize{font-family:var(--mono);font-size:11px;color:var(--text-faint)}
  .card-t .ract{opacity:0;width:24px;height:24px}
  .card-t:hover .ract,.card-t.sel .ract{opacity:1}

  /* ================= 空态 ================= */
  .empty{padding:64px 24px;text-align:center;color:var(--text-faint);font-size:13.5px}
  .empty .eico{color:var(--text-faint);opacity:.5;margin-bottom:14px;display:flex;justify-content:center}
  .empty .eico svg{width:38px;height:38px}
  .empty .acts{display:flex;gap:9px;justify-content:center;margin-top:18px}

  /* ================= 浮动菜单 ================= */
  .menu{
    position:fixed;z-index:150;min-width:168px;
    background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:var(--radius);
    box-shadow:var(--shadow-sm);padding:5px;display:none;
  }
  .menu.on{display:block}
  .menu button{
    width:100%;display:flex;align-items:center;gap:9px;
    background:transparent;border:none;border-radius:var(--radius-sm);
    padding:7px 10px;font-size:13px;color:var(--text);cursor:pointer;
    text-align:left;transition:background .12s;
  }
  .menu button:hover{background:var(--bg-hover)}
  .menu button svg{width:14px;height:14px;color:var(--text-dim);flex-shrink:0}
  .menu button.danger{color:var(--red)}
  .menu button.danger svg{color:var(--red)}
  .menu button:disabled{opacity:.4;cursor:default}
  .menu button:disabled:hover{background:transparent}
  .menu .hr{height:1px;background:var(--border);margin:5px 0}

  /* ================= 弹层 ================= */
  .modal{
    position:fixed;inset:0;z-index:100;background:var(--scrim);
    backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:24px;
  }
  .modal.on{display:flex}
  .sheet{
    background:var(--bg);border:1px solid var(--border-strong);border-radius:12px;
    width:100%;max-width:480px;padding:24px;box-shadow:var(--shadow);
    max-height:calc(100vh - 48px);overflow-y:auto;
  }
  .sheet.wide{max-width:760px}
  .sheet h3{font-size:16px;font-weight:600;margin-bottom:6px;letter-spacing:-.01em}
  .sheet .hint{color:var(--text-dim);font-size:13px;margin-bottom:18px;line-height:1.55}
  .sheet .hint b{color:var(--text);font-weight:600}
  .field{margin-bottom:16px}
  .field label{
    font-family:var(--mono);font-size:11px;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;display:block;
  }
  .input{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    font-family:var(--sans);font-size:14px;padding:10px 12px;
    border-radius:var(--radius-sm);outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  /* 只输数字的框（动态码）：等宽 + 拉开字距，好数位数 */
  .input.mono{font-family:var(--mono);font-size:17px;letter-spacing:.28em;text-indent:.28em}
  .textarea{
    width:100%;height:72px;resize:none;background:var(--bg);border:1px solid var(--border);
    color:var(--text);font-family:var(--mono);font-size:12px;padding:10px;
    border-radius:var(--radius-sm);outline:none;line-height:1.5;
  }
  .textarea:focus{border-color:var(--accent)}
  .sheet-act{display:flex;gap:9px;margin-top:20px;justify-content:flex-end}

  /* OSS 配置表单：双列排紧凑字段；布尔开关一行一个 */
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .ckline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);margin:0 0 10px;cursor:pointer;user-select:none}
  .ckline input{accent-color:var(--brand-a);width:15px;height:15px;cursor:pointer;flex:none}
  .btn-ghost.danger{color:var(--danger, #e5484d)}

  /* ===== 用户管理面板 =====
     一行三段：左边「身份块」（名字+账号+标签+统计，合成一个整体），
     右边「配额」和「操作」。
     早先把统计单列一列，结果它挤在配额旁边、和名字之间空出一大片，
     每行都像断成两半；合成一块之后左边自成一体，右边控件对齐成一条线。 */
  .utable{display:flex;flex-direction:column;max-height:56vh;overflow:auto;margin-top:2px}
  .urow{
    display:grid;
    /* 第 2 列是操作、第 3 列是配额：DOM 顺序也按这个来。
       原因是行的实际高度由最高的那一格决定（配额输入框比按钮高），
       而行内垂直居中按"行盒"算 —— 操作按钮排在后面时会被压到中线以下，
       www 那一行的「下线」就明显偏低了。

       第 3 列用 auto（原来是写死 116px）：配额那一格的内容是
       输入框 + GB + 保存 + 来源标记，写死宽度装不下就会**把输入框挤扁**
       （min-width:0 的 flex 子项可以被压到 0，看着就是个空框）。
       让它按内容撑开，输入框就不会再变形。 */
    grid-template-columns:minmax(0,1fr) auto auto;
    align-items:center;gap:4px 16px;padding:13px 6px 13px 4px;
    border-bottom:1px solid var(--border, rgba(128,128,128,.15));
  }
  .urow:last-child{border-bottom:none}
  .urow:hover{background:var(--accent-soft)}
  .urow.is-off{opacity:.6}
  /* min-width:0 是关键：没有它，超长用户名会把网格撑开、挤掉右边两列 */
  .urow .uid{min-width:0}
  .urow .uid .nick{font-size:13.5px;font-weight:600;color:var(--text)}
  .urow .uid .sub{
    display:block;font-size:11.5px;color:var(--text-dim);
    margin-top:3px;line-height:1.5;overflow-wrap:anywhere;
  }
  .urow .uid .ustat{
    display:flex;flex-wrap:wrap;gap:2px 14px;
    margin-top:6px;font-size:12px;color:var(--text-dim);
    font-variant-numeric:tabular-nums;
  }
  .urow .uid .ustat .k{
    display:inline-block;min-width:2.6em;color:var(--text-faint);
  }
  /* 配额：固定一列，输入框 + 单位 + 保存。单位写在框外而不是框内，
     因为框里是右对齐的数字，跟在数字后面加「GB」会挤到右边不好读。 */
  .urow .uquota{grid-column:3;display:flex;align-items:center;gap:5px;justify-content:flex-end}
  /* min-width 是必需的：不给的话 flex 会把它压到 0，输入框看着是个空框。
     （列宽原来写死 116px，内容一多就把输入框挤没了。） */
  .urow .uquota .input{
    width:52px;min-width:46px;padding:4px 8px;font-size:12.5px;text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .urow .uquota .unit{font-size:12px;color:var(--text-faint);flex:none}
  .urow .uquota .btn-ghost{padding:4px 8px;font-size:12px;flex:none}
  /* 配额的来源标记：「默认」= 跟随全站默认，「单独设置」= 覆盖过。
     没有它的话，空输入框看不出是"没设"还是"不限" —— 顶部说明和每行
     显示会互相打架（说默认 1GB，每行却像不限）。 */
  .urow .uquota .uq-why{
    font-style:normal;font-size:11px;color:var(--text-faint);flex:none;
  }
  .urow .uq-fixed{
    font-style:normal;font-size:12px;color:var(--text-faint);
    width:100%;text-align:right;padding-right:4px;
  }
  .urow .uacts{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .urow .uacts .btn-ghost{padding:5px 10px;font-size:12px;white-space:nowrap}
  /* 没有可做的操作时留个占位，网格列宽不会因此变化 */
  .urow .uacts .none{font-size:12px;color:var(--text-faint);padding:5px 2px}
  .urow .uacts .danger{cursor:pointer}
  .badge{
    display:inline-block;font-size:11px;line-height:1.65;padding:0 6px;border-radius:4px;
    border:1px solid var(--border);color:var(--text-dim);margin-left:6px;
    vertical-align:1.5px;font-weight:500;
  }
  .badge.off{color:#e5484d;border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.07)}
  .badge.role{color:var(--brand-a,#5b8def);border-color:rgba(91,141,239,.4);background:var(--accent-soft)}

  /* 窄屏：算一下 390px 的手机里这一行有多少可用宽度 ——
     弹窗左右各留 24px、行内再减掉 padding，实际只有约 320px。
     原来统计（auto）+ 操作（auto）+ 配额（固定 116px）三列挤在一起放不下，
     配额那一列被压到只剩一点，数字「1」都换了行，看着就是错位。
     改成三行：身份 / 统计 / 「配额 + 操作」并排在右。 */
  @media (max-width:640px){
    .urow{
      grid-template-columns:minmax(0,1fr) auto;
      gap:7px 12px;padding:13px 2px;
    }
    .urow .uid{grid-column:1 / -1;grid-row:1}
    .urow .ustat{grid-column:1 / -1;grid-row:2;min-width:0}
    /* 第 3 行左边留给操作、右边留给配额（配额贴右）。配额在 DOM 里排在后面，
       用显式列位把它放到右边 —— 这样「有配额输入的行」和「显示不受限的行」
       按钮都从同一个 x 开始，不会一行一个样。 */
    .urow .uacts{grid-column:1;grid-row:3;justify-content:flex-end;padding-right:14px}
    .urow .uquota{grid-column:2;grid-row:3;justify-content:flex-end}
    /* 桌面上输入框是 52px，但窄屏这一列是 auto，会被撑宽 ——
       结果占位符「不限」离「GB」老远，看着散。手机上不必留那么宽。 */
    .urow .uquota .input{width:44px;padding:4px 6px}
  }
  .sheet-act.spread{justify-content:space-between}

  /* 个人资料弹窗 */
  .prof{display:flex;align-items:center;gap:16px;margin-bottom:20px}
  .prof-side{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
  .prof-side button{
    min-width:78px;
    background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text-dim);font-size:12.5px;padding:6px 12px;cursor:pointer;
    transition:color .15s,border-color .15s,background .15s;
  }
  .prof-side button:hover{color:var(--text);border-color:var(--border-strong);background:var(--bg-hover)}
  .prof-side button:disabled{opacity:.45;cursor:default}

  /* 危险提示 */
  .warn{
    display:flex;gap:10px;align-items:flex-start;
    background:var(--red-soft);border:1px solid rgba(229,83,75,.22);
    border-radius:var(--radius-sm);padding:11px 13px;font-size:12.5px;
    color:var(--text-dim);line-height:1.55;margin-bottom:16px;
  }
  .warn svg{width:15px;height:15px;color:var(--red);flex-shrink:0;margin-top:2px}
  .warn b{color:var(--red);font-weight:600}
  .notice{
    display:flex;gap:10px;align-items:flex-start;
    background:var(--amber-soft);border:1px solid rgba(212,165,72,.25);
    border-radius:var(--radius-sm);padding:11px 13px;font-size:12.5px;
    color:var(--text-dim);line-height:1.55;
  }
  .notice svg{width:15px;height:15px;color:var(--amber);flex-shrink:0;margin-top:2px}

  /* 结果 / 分享卡片 */
  .share-card{
    border:1px solid var(--border);border-radius:var(--radius);
    background:var(--bg-elev);padding:14px;margin-bottom:10px;
  }
  .share-card .sc-head{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .share-card .sc-head .fico svg{width:16px;height:16px}
  .share-card .sc-name{font-size:13.5px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .share-card .sc-ttl{font-family:var(--mono);font-size:11px;color:var(--text-faint);flex-shrink:0}
  .kv{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .kv:last-child{margin-bottom:0}
  .kv label{
    font-family:var(--mono);font-size:10.5px;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.06em;width:52px;flex-shrink:0;
  }
  /* 链接要能一眼看全：换行铺开，不要横向滚动条。
     原来是 white-space:nowrap + overflow-x:auto，链接长一点就变成一条
     只能左右拖的窄缝 —— 看着别扭，复制走也不踏实。
     URL 里没有空格，得靠 break-all 才断得开行。 */
  .kv .val{
    flex:1;min-width:0;font-family:var(--mono);font-size:12px;
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:10px 11px;color:var(--text);
    white-space:normal;word-break:break-all;line-height:1.6;
  }
  .kv .val.pw{letter-spacing:.16em;font-weight:600;color:var(--accent)}
  .kv .copy{
    flex-shrink:0;background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius-sm);color:var(--text-dim);cursor:pointer;
    padding:7px 9px;display:flex;align-items:center;transition:all .15s;
  }
  .kv .copy:hover{color:var(--text);border-color:var(--border-strong)}
  .kv .copy svg{width:13px;height:13px}

  /* 目录选择器 */
  .picker{
    border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-sunken);
    max-height:290px;overflow-y:auto;padding:6px;
  }
  .pk-row{
    display:flex;align-items:center;gap:9px;padding:7px 9px;
    border-radius:var(--radius-sm);cursor:pointer;transition:background .12s;
    font-size:13.5px;
  }
  .pk-row:hover{background:var(--bg-hover)}
  .pk-row.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
  .pk-row.dis{opacity:.35;cursor:default}
  .pk-row.dis:hover{background:transparent}
  .pk-row svg{width:15px;height:15px;flex-shrink:0;color:var(--accent)}
  .pk-row.dis svg{color:var(--text-faint)}
  .pk-row .pk-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pk-row .pk-why{margin-left:auto;font-size:11px;color:var(--text-faint);flex-shrink:0}

  /* 分享管理 */
  .mg-list{max-height:400px;overflow-y:auto;margin:-4px -4px 0;padding:4px}
  .mg-item{
    display:block;padding:11px;
    border:1px solid var(--border);border-radius:var(--radius);
    background:var(--bg-elev);margin-bottom:8px;
  }
  .mg-item.dead{opacity:.55}
  .mg-head{display:flex;align-items:center;gap:11px;min-width:0}
  .mg-rows{margin-top:9px;padding:8px 10px;display:grid;gap:7px;
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm)}
  .mg-row{display:flex;align-items:center;gap:8px;min-width:0}
  .mg-row .rk{flex:none;font-size:11px;color:var(--text-faint)}
  .mg-row .rv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:var(--mono);font-size:11.5px;color:var(--text-dim)}
  .mg-row .rv.pw.mask{cursor:pointer}
  .mg-row .rv.pw.mask:hover{color:var(--text)}
  .mg-row .rv .nopw{font-style:normal;color:var(--text-faint)}
  .mg-row .mini{flex:none}
  .mg-item .fico svg{width:17px;height:17px}
  .mg-meta{flex:1;min-width:0}
  .mg-name{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mg-sub{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:2px}
  .mg-sub .exp{color:var(--amber)}
  .mg-sub .gone{color:var(--red)}
  .mg-acts{display:flex;gap:6px;flex-shrink:0}
  .mini{
    font-size:11.5px;color:var(--text-dim);background:var(--bg);
    border:1px solid var(--border);border-radius:4px;padding:4px 9px;
    cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px;
    font-family:var(--sans);white-space:nowrap;
  }
  .mini:hover{color:var(--text);border-color:var(--border-strong);background:var(--bg-hover)}
  .mini.danger{color:var(--red);border-color:rgba(229,83,75,.3)}
  .mini.danger:hover{background:var(--red-soft)}
  .mini svg{width:12px;height:12px}

  /* 时长选择器（分享/续期共用） */
  .ttl-pick{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .ttl-pick .tp-n{width:62px;text-align:center;padding:7px 4px}
  .ttl-pick .tp-n:disabled{opacity:.35}
  .ttl-pick .tp-u{font-size:12.5px;color:var(--text-dim)}
  .ttl-pick .tp-perm{margin-left:auto;padding:7px 12px;font-size:12.5px}
  .ttl-pick .tp-perm.on{
    color:var(--green);border-color:rgba(76,183,130,.45);
    background:var(--green-soft);
  }

  /* 权限勾选框：整行可点。左边方框、右边文字，纵向排列。
     不用按钮开关 —— 同一屏里既有勾选框又有开关会显得像两套系统。 */
  /* 权限勾选框：一行一个，左边方框、右边文字，横向排列。
     刻意把尺寸和 display 都写全 —— 这套控件在弹窗里，
     少一条就可能被别的规则影响，表现成"勾选框掉到文字下面"。 */
  .perm-list{display:flex;flex-direction:column}
  .perm-row{
    display:flex;flex-direction:row;align-items:center;gap:9px;
    padding:6px 0;cursor:pointer;
  }
  .perm-row .cb{flex:0 0 auto}
  .perm-txt{flex:1 1 auto;font-size:13px;color:var(--text-dim);transition:color .15s;line-height:1.4}
  .perm-row:hover .perm-txt{color:var(--text)}
  /* 分享管理里的四个权限开关：预览 下载 保存 水印。
     紧凑形式（✓/✗ + 两个字），四个稳在一行里 ——
     用 16px 的方框勾选框会挤到换行。 */
  .mg-perm .rv{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
  .pt{
    display:inline-flex;align-items:center;gap:3px;
    font-size:11.5px;line-height:1.5;cursor:pointer;user-select:none;
    color:var(--text-faint);transition:color .15s;white-space:nowrap;
  }
  .pt:hover{color:var(--text-dim)}
  .pt.on{color:var(--green)}

  /* ================= 上传面板 ================= */
  .up{
    position:fixed;right:22px;bottom:22px;width:330px;z-index:90;
    background:var(--bg-elev);border:1px solid var(--border-strong);
    border-radius:var(--radius);box-shadow:var(--shadow);display:none;overflow:hidden;
  }
  .up.on{display:block}
  .up-head{
    display:flex;align-items:center;gap:9px;padding:11px 13px;
    border-bottom:1px solid var(--border);
  }
  .up-head .t{font-size:13px;font-weight:500;flex:1;min-width:0}
  .up-head .x{
    width:22px;height:22px;display:flex;align-items:center;justify-content:center;
    background:transparent;border:none;color:var(--text-faint);cursor:pointer;border-radius:4px;
  }
  .up-head .x:hover{background:var(--bg-hover);color:var(--text)}
  .up-head .x svg{width:13px;height:13px}
  .up-list{max-height:230px;overflow-y:auto;padding:8px}
  /* 空状态：没有任何传输任务时，列表不能是一片空白 —— 那样头和脚两条边框
     会贴在一起（中间只剩 padding），看着像面板坏了。
     给一块固定的留白 + 一句话说明这个面板是干什么的。 */
  .up-empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:7px;min-height:96px;padding:14px 10px;text-align:center;
  }
  .up-empty svg{width:22px;height:22px;color:var(--text-faint);opacity:.6}
  .up-empty .t1{font-size:12.5px;color:var(--text-dim)}
  .up-empty .t2{font-size:11.5px;color:var(--text-faint);line-height:1.5}

  /* 未完成传输的提示条：夹在列表和底栏之间，只在真有记录时出现 */
  .up-recover{
    border-top:1px solid var(--border);
    background:var(--bg-sunken);
    padding:10px 12px 11px;
  }
  .up-recover .rc-head{display:flex;align-items:baseline;gap:8px}
  .up-recover .rc-t{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--text)}
  .up-recover .rc-x{
    background:transparent;border:none;color:var(--text-faint);cursor:pointer;
    font-size:11.5px;padding:2px 4px;border-radius:4px;font-family:var(--sans);flex:none;
  }
  .up-recover .rc-x:hover{color:var(--text);background:var(--bg-hover)}
  .up-recover .rc-note{font-size:11px;color:var(--text-faint);line-height:1.55;margin-top:3px}
  .up-recover .rc-list{margin-top:7px;max-height:104px;overflow-y:auto}
  .up-recover .rc-item{
    display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:11.5px;
  }
  .up-recover .rc-name{
    flex:1;min-width:0;color:var(--text-dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .up-recover .rc-item.rs .rc-name{color:var(--text)}
  .up-recover .rc-stat{
    flex:none;color:var(--text-faint);font-family:var(--mono);font-size:10.5px;white-space:nowrap;
  }
  .up-recover .rc-item.rs .rc-stat{color:var(--accent)}
  .up-recover .rc-go{
    width:100%;margin-top:9px;padding:7px 10px;cursor:pointer;
    background:var(--accent);border:1px solid transparent;border-radius:var(--radius-sm);
    color:#fff;font-size:12.5px;font-family:var(--sans);font-weight:500;
  }
  .up-recover .rc-go:hover{filter:brightness(1.06)}
  .up-item{padding:7px 6px;border-radius:var(--radius-sm)}
  .up-item:hover{background:var(--item-hover)}
  .up-top{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
  .up-name{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .up-stat{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);flex-shrink:0}
  .up-stat.ok{color:var(--green)}
  .up-stat.bad{color:var(--red)}
  .up-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
  .up-fill{height:100%;background:var(--accent);width:0;transition:width .2s}
  .up-item.done .up-fill{background:var(--green)}
  .up-item.fail .up-fill{background:var(--red)}
  .up-item.pause .up-fill{background:var(--amber)}
  .up-sec{font-size:10.5px;color:var(--text-faint);padding:4px 6px 2px;letter-spacing:.06em}
  .up-acts{display:flex;gap:4px;flex-shrink:0;align-self:center}
  .up-act{
    background:transparent;border:none;color:var(--text-dim);cursor:pointer;
    font-size:11px;padding:2px 5px;border-radius:4px;font-family:var(--sans);
    white-space:nowrap;
  }
  .up-act:hover{color:var(--text);background:var(--bg-hover)}
  .up-foot{
    padding:9px 13px;border-top:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;gap:9px;
    font-size:11.5px;color:var(--text-faint);font-family:var(--mono);
  }
  .up-foot button{
    background:transparent;border:none;color:var(--text-dim);cursor:pointer;
    font-size:11.5px;text-decoration:underline;text-underline-offset:2px;
  }
  .up-foot button:hover{color:var(--text)}

  /* ================= 拖拽投放层 ================= */
  .drop{
    position:fixed;inset:0;z-index:120;background:var(--scrim);
    backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;
  }
  .drop.on{display:flex}
  .drop-box{
    border:2px dashed var(--accent);border-radius:16px;background:var(--bg-elev);
    padding:44px 60px;text-align:center;box-shadow:var(--shadow);
  }
  .drop-box svg{width:34px;height:34px;color:var(--accent);margin-bottom:14px}
  .drop-box .t{font-size:15px;font-weight:500}
  .drop-box .s{font-size:12.5px;color:var(--text-dim);margin-top:5px}

  /* toast */
  .toast{
    position:fixed;bottom:26px;left:50%;transform:translate(-50%,80px);
    background:var(--bg-elev);border:1px solid var(--border-strong);color:var(--text);
    font-size:13px;padding:10px 18px;border-radius:100px;box-shadow:var(--shadow);
    opacity:0;transition:all .25s;z-index:300;pointer-events:none;
    max-width:88vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.bad{border-color:rgba(229,83,75,.4);color:var(--red)}

  /* ================= 窄屏 ================= */
  @media (max-width:760px){
    .wrap,.topbar-in{padding:0 16px}
    /* 顶栏只留高频的：上传、传输、分享、主题、账号。
       新建文件夹挪到了工具栏（见下面 .tool-newfolder），顶栏那排就不挤了。 */
    .top-acts .lbl{display:none}
    .top-acts .btn,.top-acts .btn-ghost{padding:8px 10px}
    .top-acts{gap:6px}

    /* 工具栏：新建文件夹在「视图」和「搜索」之间，手机上只留图标（它用得少）。
       顺序就是 DOM 顺序，桌面端和手机端一致，不靠 order 去掰。 */
    .toolbar{gap:8px}
    .tool-newfolder{padding:8px 9px}
    .tool-newfolder .lbl{display:none}
    /* 视图按钮挪到搜索框前面之后，窄屏要让它俩待在同一行；
       原来这里的 min-width:100% 会把搜索框单独挤到下一行去。 */
    .search{min-width:0}
    .lhead,.row{grid-template-columns:26px 1fr 62px 40px;gap:10px;padding-left:12px;padding-right:12px}
    .row .fdate,.lhead .h-date{display:none}
    .ract{opacity:1}
    .up{right:12px;left:12px;width:auto;bottom:12px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));padding:10px}

    /* 选择操作条：手机上改成上下两行 —— 上面一行只说"选了几项"，
       下面一行五个按钮等宽铺满。这样既不会参差不齐，手指也更好点。 */
    .selbar{
      left:12px;right:12px;bottom:12px;
      width:auto;max-width:none;
      display:grid;grid-template-columns:1fr;
      gap:9px;padding:11px 12px;
      transform:translate(0,calc(100% + 40px));
    }
    .selbar.on{transform:translate(0,0)}
    .selbar .cnt{font-size:12.5px}
    .selbar .sel-acts{margin-left:0;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
    .selbar .sel-acts .btn-ghost{justify-content:center;padding:8px 4px;font-size:12px;gap:5px}
    .selbar .sel-acts .btn-ghost svg{width:14px;height:14px}

    /* 登录门：左右分栏改成上下。
       手机上横向空间本来就紧，左边那整列品牌会把输入框挤没，
       所以让品牌压成顶部一条（图标和名字并排），省下来的宽度全给表单。 */
    .gate{padding:16px}
    .gate-card{grid-template-columns:1fr}
    .gate-side{flex-direction:row;align-items:center;justify-content:flex-start;gap:11px;padding:16px 20px}
    .gs-mark{width:38px;height:38px}
    .gs-mark svg{width:38px;height:38px}
    /* 窄屏上品牌压成一行，slogan 挤不下就别硬塞 */
    .gs-slogan{display:none}
    .gs-name{font-size:19px}
    .gate-form{padding:28px 22px 32px}
    .gate-glow.a{width:300px;height:300px}
    .gate-glow.b{width:280px;height:280px}
  }
  /* ---------- 预览弹层（.pv-*）----------
     主站和分享页用的是同一套类名与结构。改动请两边一起改。 */
  .pv{position:fixed;inset:0;z-index:200;background:var(--pv-scrim);
      display:flex;flex-direction:column}
  .pv[hidden]{display:none}
  html.pv-lock{overflow:hidden}

  .pv-h{flex:none;display:flex;align-items:center;gap:9px;
        padding:11px 13px;background:var(--bg);border-bottom:1px solid var(--border)}
  .pv-name{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--text);
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pv-nav{flex:none;display:flex;align-items:center;gap:3px}
  .pv-count{font-size:12px;color:var(--text-dim);min-width:44px;text-align:center;
            font-variant-numeric:tabular-nums}
  .pv-acts{flex:none;display:flex;align-items:center;gap:3px}

  .pv-nav button,.pv-act{display:inline-flex;align-items:center;justify-content:center;
      width:34px;height:34px;border-radius:var(--radius-sm);
      border:1px solid transparent;background:transparent;color:var(--text-dim);
      cursor:pointer;transition:background .15s,color .15s}
  .pv-nav button:hover:not(:disabled),.pv-act:hover{background:var(--bg-hover);color:var(--text)}
  .pv-nav button:disabled{opacity:.3;cursor:default}
  .pv-nav button svg,.pv-act svg{width:17px;height:17px}

  .pv-b{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
        padding:16px;overflow:auto}
  /* 图片：contain 保证整图可见（不裁切、不放大失真）。点背景关闭 */
  .pv-b img.pv-media{max-width:100%;max-height:100%;object-fit:contain;
        border-radius:var(--radius-sm);cursor:default}
  .pv-b video.pv-media{max-width:100%;max-height:100%;border-radius:var(--radius-sm);
        background:#000;outline:none}
  .pv-b audio.pv-media{width:min(560px,100%)}
  /* PDF：给足高度，浏览器自带阅读器在 iframe 里才展得开 */
  .pv-b iframe.pv-media{width:100%;height:100%;min-height:420px;border:none;
        border-radius:var(--radius-sm);background:#fff}
  .pv-msg{font-size:13px;color:#fff;opacity:.8;text-align:center;line-height:1.7;
          padding:30px 20px;max-width:420px}

  @media (max-width:600px){
    .pv-h{padding:9px 10px;gap:5px}
    .pv-name{font-size:12.5px}
    .pv-count{min-width:38px;font-size:11.5px}
    .pv-nav button,.pv-act{width:32px;height:32px}
    /* 手机上把"新窗口打开"收起来：PDF 之外用不到，省出横向空间 */
    .pv-b{padding:8px}
    .pv-b iframe.pv-media{min-height:60vh}
  }

</style>
</head>
<body>

<!-- ==================== 登录门 ==================== -->
<!-- 左右分栏 + 毛玻璃。左边只放品牌视觉，右边是表单。
     两步（密码 / 动态码）都在右边原地切换，左侧始终不动 —— 切换时页面不跳。 -->
<div class="gate" id="gate">
  <!-- 光斑。毛玻璃得有东西可以透，纯色背景上 blur 是看不出来的 -->
  <div class="gate-glow a"></div>
  <div class="gate-glow b"></div>

  <div class="gate-card">
    <!-- 左：品牌。标识、名字和一句品牌语 -->
    <aside class="gate-side">
      <div class="gs-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/></svg>
      </div>
      <div class="gs-name" id="gateTitle">Sunlight&#8201;云盘</div>
      <p class="gs-slogan">文件放在自己手里</p>
    </aside>

    <!-- 右：表单 -->
    <div class="gate-form">
      <!-- 第一步：用户名 + 密码 -->
      <div id="step1">
        <input type="text" class="gate-input" id="user" placeholder="用户名" autocomplete="username"
               autocapitalize="none" autocorrect="off" spellcheck="false">
        <input type="password" class="gate-input" id="pwd" placeholder="密码" autocomplete="current-password">
        <button class="gate-btn" id="pwdBtn"><span class="lbl">登录</span></button>
        <div class="gate-foot" id="footLogin">还没有账号？<a id="goSignup">注册</a></div>
      </div>

      <!-- 第二步：动态码 -->
      <div id="step2" style="display:none">
        <h2>输入动态码</h2>
        <input type="text" class="gate-input code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" spellcheck="false">
        <div class="period">
          <div class="period-bar"><div class="period-fill" id="periodFill"></div></div>
          <div class="period-txt" id="periodTxt">—</div>
        </div>
        <button class="gate-btn" id="codeBtn"><span class="lbl">进入</span></button>
        <span class="gate-back" id="back">返回上一步</span>
      </div>

      <!-- 第三步：注册 -->
      <div id="step3" style="display:none">
        <h2>创建账号</h2>
        <input type="text" class="gate-input" id="suUser" placeholder="用户名" autocomplete="username"
               autocapitalize="none" autocorrect="off" spellcheck="false">
        <input type="password" class="gate-input" id="suPwd" placeholder="密码" autocomplete="new-password">
        <input type="password" class="gate-input" id="suPwd2" placeholder="再输一遍密码" autocomplete="new-password">
        <button class="gate-btn" id="suBtn"><span class="lbl">创建账号</span></button>
        <div class="gate-foot" id="footSignup">已经有账号了？<a id="goLogin">登录</a></div>
      </div>

      <div class="gate-err" id="gateErr"></div>
    </div>
  </div>
</div>

<!-- ==================== 主应用 ==================== -->
<div class="app" id="app">

  <div class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <!-- 多云：太阳被云挡住的部分不画，露出的弧线 + 上方放射线（苹果天气的画法） -->

/* ================================================================

   权限、限流、名字消毒、路径校验全在服务端，前端不重复实现一遍——

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtSize = b => {
  b = Number(b) || 0;
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(2) + ' GB';
};

/* 相对时间比绝对日期有用：一眼看出哪个是刚传的 */
function fmtDate(s) {
  if (!s) return '—';
  /* 老数据只存了日期没有时刻。它没有"几分钟前"可言：
     当天的显示"今天"，其余显示日期，别拿零点去算出误导性的小时数 */
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    const p = n => String(n).padStart(2, '0');
    const today = new Date();
    const t = `${today.getFullYear()}-${p(today.getMonth() + 1)}-${p(today.getDate())}`;
    return s === t ? '今天' : s;
  }
  const d = new Date(s);
  if (isNaN(d)) return String(s).slice(0, 10);
  const diff = Date.now() - d.getTime();
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
  if (diff < 7 * 86400000) return Math.floor(diff / 86400000) + ' 天前';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

  [/\.(exe|msi|bat|cmd|apk|dmg|deb|rpm)$/i, 'exec'],
  [/\.(png|jpe?g|gif|bmp|webp|svg|ico|tiff?|heic)$/i, 'img'],

 *
 * 特别注意：不能用 S.breadcrumb.at(-1) —— breadcrumb 是「祖先链，不含当前目录」，
 * 它的最后一项是父目录。在「示例目录/升级包」里那样取会得到「示例目录」，
 * 于是"新建文件夹"和拖拽上传都会告诉用户东西会放到示例目录，实际却进了升级包。
 */
const currentDirName = () => (S.current ? S.current.name : '全部文件');

/* ================================================================
   请求
   ================================================================ */
function lockGate(msg) {
  S.token = '';
  S.account = null;
  try { sessionStorage.removeItem('sunlight.token'); } catch (_) {}
  $('app').classList.remove('on');
  $('gate').classList.remove('off');
  // 会话失效后又登录回来，要允许 boot() 重新拉一次数据
  booted = false;
  S.flat = []; S.children = []; S.sel.clear(); S.hits = null; S.parent = null;
  $('pwd').value = '';
  $('code').value = '';
  $('user').value = lastUser();
  /* 上传面板是上一个会话的残留：不清掉，换人登录后还会看到
     "传输完成"挂在角落。进行中的任务随令牌一并作废。 */
  S.uploads.forEach(u => { u.pauseFlag = true; if (u._xhr) { try { u._xhr.abort(); } catch (_) {} } });
  (S.downloads || []).forEach(d => { if (d.status === 'down') { d._del = true; d.controller.abort(); } });
  S.uploads = [];
  S.downloads = [];
  S.uploading = false;
  /* 顺序要紧：renderUploads() 内部会调 persistPending()，
     它会用 S.uploads（此时为空）把记录清掉并同步 S.pending。
     如果先 clearPending() 再 render，记录会被立刻写回来。 */
  renderUploads();
  S.pending = [];
  renderRecovery();
  gotoStep(1);
  if (msg) gateErr(msg);
  setTimeout(() => ($('user').value ? $('pwd') : $('user')).focus(), 80);
}

/* 记住上次登录用的用户名，下次进来自动填上。
   只存用户名 —— 它不是秘密，而且每次手输很烦。
   密码一个字都不存，会话票也只放 sessionStorage。 */
function lastUser() {
  try { return localStorage.getItem('sunlight.user') || ''; } catch (_) { return ''; }
}
function saveLastUser(u) {
  try { localStorage.setItem('sunlight.user', u); } catch (_) {}
}

async function api(path, opts = {}) {
  const headers = Object.assign({ 'Accept': 'application/json' }, opts.headers || {});
  if (opts.body !== undefined) headers['Content-Type'] = 'application/json';
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;

  const resp = await fetch(path, {
    method: opts.method || 'GET',
    headers,
    body: opts.body,
    cache: 'no-store'
  });

  if (resp.status === 401) {
    lockGate('登录状态已过期，请重新输入密码');
    const e = new Error('登录状态已过期'); e.handled = true; throw e;
  }

  let data = null;
  try { data = await resp.json(); } catch (_) {}
  if (!resp.ok || !data || data.ok === false) {
    throw new Error((data && data.error) || ('请求失败（' + resp.status + '）'));
  }
  return data;
}

/* 登录请求不走 api()：401 在登录阶段是"密码不对"，不是"会话失效"，
   混在一起会把用户踢回第一步 */
async function authPost(path, body) {
  const resp = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(body)
  });
  let data = null;
  try { data = await resp.json(); } catch (_) {}
  return { status: resp.status, data: data || {} };
}

/* ================================================================
   toast
   ================================================================ */
let toastTimer;
function toast(msg, bad) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), bad ? 3600 : 2400);
}

/* ================================================================
   数据加载
   ================================================================ */
async function loadDir(parentId) {
  const q = parentId ? '?parent=' + encodeURIComponent(parentId) : '';
  const data = await api('/api/tree' + q);
  S.parent = data.parent || null;
  S.breadcrumb = data.breadcrumb || [];
  S.current = data.current || null;
  S.children = data.children || [];
  S.stats = data.stats || {};
  S.sel.clear();
  S.lastClick = null;
  render();
}

async function loadFlat() {
  const data = await api('/api/flat');
  S.flat = data.nodes || [];
  S.stats = data.stats || S.stats;
}

/* 某个节点在树里的路径，搜索结果里显示用 */
function pathOf(id) {
  const byId = new Map(S.flat.map(n => [n.id, n]));
  const parts = [];
  let cur = byId.get(id);
  let guard = 0;
  while (cur && guard++ < 200) {
    parts.unshift(cur.name);
    cur = cur.parent ? byId.get(cur.parent) : null;
  }
  return parts.join(' / ');
}

function render() {
  renderCrumbs();

function renderCrumbs() {
  const el = $('crumbs');
  let html = '<a data-go="__root" data-drop="__root">全部文件</a>';

  if (S.hits) {
    el.innerHTML = html + '<span class="sep">/</span><span class="cur">搜索</span>';
    return;
  }

  /* 接口给的是 breadcrumb = 祖先链（不含当前目录）+ current = 当前目录。
     别把 breadcrumb 的最后一项当成"当前"，那样在子目录里会显示成父目录。 */
  S.breadcrumb.forEach(n => {
    html += `<span class="sep">/</span><a data-go="${esc(n.id)}" data-drop="${esc(n.id)}">${esc(n.name)}</a>`;
  });

  if (S.current) {
    html += `<span class="sep">/</span><span class="cur" data-drop="${esc(S.current.id)}">${esc(S.current.name)}</span>`;
  } else {
    html += `<span class="cnt">${S.children.length} 项</span>`;
